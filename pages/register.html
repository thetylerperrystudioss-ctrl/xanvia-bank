<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Register | Xanvia Credit Union</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root { --emerald: #0F8A5F; --emerald-dark: #0A5F42; --deep-green: #0B2E23; --bg: #F4F7F6; --text: #1A1A1A; --border: #E5E7EB; --muted: #6B7280; --gold: #C9A24B; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--deep-green); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; background-image: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070&auto=format&fit=crop'); background-size: cover; background-position: center; }
    body::before { content: ''; position: fixed; inset: 0; background: rgba(11, 46, 35, 0.85); z-index: 1; backdrop-filter: blur(10px); }

    .reg-card { background: white; width: 100%; max-width: 480px; padding: 40px 30px; border-radius: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.3); position: relative; z-index: 10; margin: 20px 0; }
    
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 25px; justify-content: center; }
    .logo-icon { background: var(--emerald); color: white; width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 900; }
    .logo-text { display: flex; flex-direction: column; }
    .logo-title { font-family: 'Merriweather', serif; font-size: 1.4rem; font-weight: 900; color: var(--deep-green); line-height: 1; }
    .logo-subtitle { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; color: var(--gold); letter-spacing: 1.5px; margin-top: 2px; }

    .reg-card h2 { text-align: center; color: var(--deep-green); margin-bottom: 8px; font-size: 1.4rem; }
    .reg-card p.sub { text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 25px; }

    .form-group { display: flex; flex-direction: column; margin-bottom: 15px; width: 100%; position: relative; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text); }
    .form-group input, .form-group select { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; outline: none; background: #FAFAFA; transition: 0.2s; }
    .form-group input:focus { border-color: var(--emerald); background: white; box-shadow: 0 0 0 4px rgba(15,138,95,0.1); }
    
    .file-upload { border: 2px dashed var(--border); padding: 15px; border-radius: 10px; text-align: center; cursor: pointer; background: #FAFAFA; position: relative; margin-bottom: 10px; }
    .file-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .file-upload span { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
    .file-upload.has-file { border-color: var(--emerald); background: #E6F4EE; }
    .file-upload.has-file span { color: var(--emerald); }

    .btn-primary { width: 100%; padding: 16px; background: var(--emerald); color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; margin-top: 10px; box-shadow: 0 4px 12px rgba(15,138,95,0.2); display: flex; justify-content: center; align-items: center; gap: 10px; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }
    
    .msg { display: none; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; text-align: center; font-weight: 600; }
    .msg.error { display: block; background: #FEE2E2; color: #991B1B; }
    .msg.success { display: block; background: #D1FAE5; color: #065F46; }
    
    .footer-link { text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--muted); }
    .footer-link a { color: var(--emerald); font-weight: 700; text-decoration: none; }
    .back-btn { position: absolute; top: 20px; left: 20px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--muted); text-decoration: none; z-index: 20; }
  </style>
</head>
<body>

  <div class="reg-card">
    <a href="../index.html" class="back-btn">←</a>
    <div class="logo">
      <div class="logo-icon">X</div>
      <div class="logo-text">
        <span class="logo-title">Xanvia</span>
        <span class="logo-subtitle">Credit Union</span>
      </div>
    </div>

    <h2>Open an Account</h2>
    <p class="sub">Your information is verified instantly.</p>
    <div id="msg" class="msg"></div>

    <form id="register-form" enctype="multipart/form-data">
      <div class="form-group"><label>Full Name</label><input type="text" id="reg-name" placeholder="John Doe" required></div>
      <div class="form-group"><label>Gmail Address</label><input type="email" id="reg-email" placeholder="john@gmail.com" required></div>
      <div class="form-group"><label>Phone Number</label><input type="tel" id="reg-phone" placeholder="+1 (555) 000-0000" required></div>
      <div class="form-group"><label>Age (Must be 18+)</label><input type="number" id="reg-age" placeholder="18" min="18" required></div>
      <div class="form-group"><label>Full Residential Address</label><input type="text" id="reg-address" placeholder="123 Main St, City, State, ZIP" required></div>
      <div class="form-group"><label>SSN (Last 4 Digits)</label><input type="text" id="reg-ssn" placeholder="XXXX" maxlength="4" required></div>
      <div class="form-group"><label>Password (Min 8 chars)</label><input type="password" id="reg-password" placeholder="Create a strong password" minlength="8" required></div>

      <label style="font-size:0.85rem; font-weight:600; margin-top:10px; margin-bottom:8px; display:block;">Upload Government ID (Front)</label>
      <div class="file-upload" id="box-id-front">
        <input type="file" id="id-front" accept="image/*" required onchange="updateFileName(this, 'box-id-front')">
        <span>Tap to upload ID Front</span>
      </div>

      <label style="font-size:0.85rem; font-weight:600; margin-top:10px; margin-bottom:8px; display:block;">Upload Government ID (Back)</label>
      <div class="file-upload" id="box-id-back">
        <input type="file" id="id-back" accept="image/*" required onchange="updateFileName(this, 'box-id-back')">
        <span>Tap to upload ID Back</span>
      </div>

      <label style="font-size:0.85rem; font-weight:600; margin-top:10px; margin-bottom:8px; display:block;">Proof of Address (Optional)</label>
      <div class="file-upload" id="box-poa">
        <input type="file" id="proof-of-address" accept="image/*" onchange="updateFileName(this, 'box-poa')">
        <span>Utility bill or Bank Statement</span>
      </div>

      <button type="submit" class="btn-primary" id="reg-btn">Submit & Open Account</button>
    </form>
    
    <div class="footer-link">
      Already have an account? <a href="login.html">Sign In</a>
    </div>
  </div>

  <script>
    function updateFileName(input, boxId) {
      const box = document.getElementById(boxId);
      const span = box.querySelector('span');
      if (input.files.length > 0) {
        box.classList.add('has-file');
        span.textContent = "✅ " + input.files[0].name;
      } else {
        box.classList.remove('has-file');
        span.textContent = boxId === 'box-id-front' ? 'Tap to upload ID Front' : (boxId === 'box-id-back' ? 'Tap to upload ID Back' : 'Utility bill or Bank Statement');
      }
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('reg-btn');
      const msg = document.getElementById('msg');
      
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value.toLowerCase();
      const phone = document.getElementById('reg-phone').value;
      const age = document.getElementById('reg-age').value;
      const address = document.getElementById('reg-address').value;
      const ssn = document.getElementById('reg-ssn').value;
      const password = document.getElementById('reg-password').value;
      
      const idFront = document.getElementById('id-front').files[0];
      const idBack = document.getElementById('id-back').files[0];
      const poa = document.getElementById('proof-of-address').files[0];

      // Frontend Validations
      if (!email.endsWith('@gmail.com')) {
        msg.className = "msg error"; msg.textContent = "Please enter a valid Gmail address."; return;
      }
      if (password.length < 8) {
        msg.className = "msg error"; msg.textContent = "Password must be at least 8 characters."; return;
      }
      if (age < 18) {
        msg.className = "msg error"; msg.textContent = "You must be 18 or older to open an account."; return;
      }

      btn.innerHTML = "Verifying Information... ⏳"; 
      btn.disabled = true; 
      msg.style.display = "none";

      // Build FormData to support file uploads
      const formData = new FormData();
      formData.append('name', name);
      formData.append('email', email);
      formData.append('phone', phone);
      formData.append('age', age);
      formData.append('address', address);
      formData.append('ssn_last4', ssn);
      formData.append('password', password);
      
      formData.append('id_front', idFront);
      formData.append('id_back', idBack);
      if (poa) formData.append('proof_of_address', poa);

      try {
        const res = await fetch('/api/register', {
          method: 'POST', 
          body: formData 
        });
        const data = await res.json();

        if (data.success) {
          msg.className = "msg success";
          msg.textContent = "Information Verified! Opening account...";
          
          // Auto-login the user by storing their token/user details
          localStorage.setItem("xanvia_user", JSON.stringify({ 
            id: data.userId, 
            name: name, 
            email: email, 
            has_bank: true, 
            has_loan: true, 
            has_investment: true 
          }));
          
          // Redirect straight to the dashboard
          setTimeout(() => {
            window.location.href = "hub.html";
          }, 1500);
        } else {
          msg.className = "msg error"; 
          msg.textContent = data.error || "Verification failed.";
          btn.innerHTML = "Submit & Open Account"; 
          btn.disabled = false;
        }
      } catch (err) {
        msg.className = "msg error"; 
        msg.textContent = "Server error. Try again.";
        btn.innerHTML = "Submit & Open Account"; 
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
