<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Withdraw | Xanvia</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <main class="main-content" style="margin-left: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <div class="panel" style="max-width: 500px; width: 100%;">
      <h2 style="color: var(--deep-green); margin-bottom: 10px;">Withdraw Funds</h2>
      <p style="color: var(--muted); margin-bottom: 20px; font-size: 0.9rem;">Funds are held until Admin processes the request.</p>
      
      <div class="form-group"><label>Amount ($)</label><input type="number" id="amount"></div>
      <div class="form-group"><label>Receiving Details (Bank / BTC)</label><input type="text" id="details" placeholder="Account number or BTC address"></div>
      <button class="btn-primary" onclick="submitWithdraw()">Request</button>
      <button class="btn-outline" onclick="window.location.href='dashboard.html'">Back</button>
      <div id="msg" style="margin-top: 15px; font-weight: bold; text-align: center;"></div>
    </div>
  </main>
  <script>
    const user = JSON.parse(localStorage.getItem("xanvia_user"));
    async function submitWithdraw() {
      const amount = parseFloat(document.getElementById('amount').value);
      const details = document.getElementById('details').value;
      const msg = document.getElementById('msg');

      const res = await fetch('/api/withdraw/request', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: user.id, amount, details })
      });
      const data = await res.json();
      msg.textContent = data.message || data.error;
      msg.style.color = data.success ? "var(--emerald)" : "red";
    }
  </script>
</body>
</html>
