<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Accounts | Xanvia Credit Union</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root { --emerald: #0F8A5F; --deep-green: #0B2E23; --bg: #F8F9FA; --text: #1A1A1A; --border: #E5E7EB; --muted: #6B7280; --gold: #C9A24B; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; padding-bottom: 50px; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 20px; max-width: 600px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon { background: var(--emerald); color: white; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: 800; }
    .logo-text { display: flex; flex-direction: column; }
    .logo-title { font-family: 'Merriweather', serif; font-size: 1.1rem; font-weight: 900; color: var(--deep-green); line-height: 1; }
    .logo-subtitle { font-size: 0.55rem; font-weight: 700; text-transform: uppercase; color: var(--gold); letter-spacing: 1.5px; margin-top: 2px; }

    .btn-logout { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
    .panel { background: white; border-radius: 16px; padding: 25px; margin-bottom: 20px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
    .panel h2 { font-size: 1.2rem; color: var(--deep-green); margin-bottom: 10px; }
    .panel p { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
    .btn-primary { background: var(--emerald); color: white; border: none; padding: 14px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; display: block; text-align: center; text-decoration: none; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="grid">
    <div class="header">
      <div class="logo">
        <div class="logo-icon">X</div>
        <div class="logo-text">
          <span class="logo-title">Xanvia</span>
          <span class="logo-subtitle">Credit Union</span>
        </div>
      </div>
      <button class="btn-logout" onclick="logout()">Log Out</button>
    </div>

    <div class="panel">
      <h2>🏦 Personal Banking</h2>
      <p>Manage checking, savings, deposits, and transfers.</p>
      <div id="bank-action">Loading...</div>
    </div>
    <div class="panel">
      <h2>💳 Smart Lending</h2>
      <p>Apply for personal loans and track repayments.</p>
      <div id="loan-action">Loading...</div>
    </div>
    <div class="panel">
      <h2>📈 Wealth Management</h2>
      <p>Trade stocks and buy Bitcoin.</p>
      <div id="invest-action">Loading...</div>
    </div>
  </div>

  <script>
    let user = JSON.parse(localStorage.getItem("xanvia_user"));
    if (!user) window.location.replace("../index.html");
    
    function logout() {
      localStorage.removeItem("xanvia_user");
      window.location.replace("../index.html"); 
    }

    async function checkAccountStatus() {
      try {
        const res = await fetch(`/api/user-status/${user.id}`);
        const data = await res.json();

        if (data.has_bank) {
          document.getElementById('bank-action').innerHTML = `<a href="dashboard.html" class="btn-primary">Go to Bank Dashboard</a>`;
        } else {
          document.getElementById('bank-action').innerHTML = `<a href="onboarding.html?type=bank" class="btn-primary">Apply for Bank Account</a>`;
        }

        if (data.has_loan) {
          document.getElementById('loan-action').innerHTML = `<a href="loans.html" class="btn-primary">Go to Loan Center</a>`;
        } else {
          document.getElementById('loan-action').innerHTML = `<a href="onboarding.html?type=loan" class="btn-primary">Apply for Loan Account</a>`;
        }

        if (data.has_investment) {
          document.getElementById('invest-action').innerHTML = `<a href="investments.html" class="btn-primary">Go to Investments</a>`;
        } else {
          document.getElementById('invest-action').innerHTML = `<a href="onboarding.html?type=investment" class="btn-primary">Apply for Investment Account</a>`;
        }
      } catch (err) {
        console.error("Error fetching status:", err);
        // Fallback if network fails
        document.getElementById('bank-action').innerHTML = `<a href="dashboard.html" class="btn-primary">Go to Bank Dashboard</a>`;
      }
    }

    checkAccountStatus();
  </script>
</body>
</html>
