<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Center | Xanvia Credit Union</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/dashboard.css">
  <style>
    body { background-color: #F4F7F6; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 600px; background: #F4F7F6; min-height: 100vh; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
    .loan-header { background: linear-gradient(160deg, #11553F 0%, #0A2E23 100%); color: white; padding: 30px 20px 50px; border-radius: 0 0 30px 30px; position: relative; }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header-top a { color: white; text-decoration: none; font-size: 1.5rem; }
    .loan-summary { text-align: center; }
    .loan-summary p { font-size: 0.85rem; color: rgba(255,255,255,0.7); text-transform: uppercase; letter-spacing: 1px; }
    .loan-summary h2 { font-size: 3rem; font-weight: 700; margin: 5px 0 15px; letter-spacing: -1px; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: -30px 20px 20px; position: relative; z-index: 10; }
    .stat-card { background: white; padding: 20px 15px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); text-align: center; }
    .stat-card p { font-size: 0.75rem; color: var(--muted); font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
    .stat-card h3 { font-size: 1.4rem; color: var(--deep-green); font-weight: 700; }
    .stat-card h3.debt { color: var(--danger); }
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px 20px; }
    .action-btn { padding: 16px; border-radius: 12px; font-weight: 600; font-size: 0.95rem; text-align: center; border: none; cursor: pointer; }
    .btn-primary { background: var(--emerald); color: white; }
    .btn-outline { background: white; color: var(--text); border: 1px solid var(--border); }
    .btn-full { grid-column: span 2; }
    .history-panel { padding: 0 20px 30px; }
    .tx-item { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .tx-info h4 { font-size: 0.95rem; margin-bottom: 4px; }
    .tx-info p { font-size: 0.75rem; color: var(--muted); }
    .tx-amount { font-weight: 700; text-align: right; }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="loan-header">
      <div class="header-top">
        <a href="hub.html">←</a>
        <div class="logo" style="color: white; font-family: var(--font-serif); font-weight: 700;">Xanvia</div>
        <div style="width: 24px;"></div>
      </div>
      <div class="loan-summary">
        <p>Available Loan Balance</p>
        <h2 id="loan-balance">$0.00</h2>
      </div>
    </header>

    <main>
      <div class="stats-grid">
        <div class="stat-card">
          <p>Total Approved</p>
          <h3 id="total-approved">$0.00</h3>
        </div>
        <div class="stat-card">
          <p>Outstanding Debt</p>
          <h3 class="debt" id="total-debt">$0.00</h3>
        </div>
      </div>

      <div class="action-grid">
        <button class="action-btn btn-primary btn-full" onclick="openModal('apply')">Apply for Loan</button>
        <button class="action-btn btn-outline" onclick="openModal('transfer')">Transfer Funds</button>
        <button class="action-btn btn-outline" onclick="openModal('repay')">Repay Loan</button>
      </div>

      <div class="history-panel">
        <h3 style="color: var(--deep-green); margin-bottom: 15px;">Loan Transaction History</h3>
        <div id="history-list"></div>
      </div>
    </main>
  </div>

  <!-- MODALS -->
  <div id="modal-apply" class="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:white; padding:30px; border-radius:20px; width:90%; max-width:400px;">
      <h2 style="color:var(--deep-green); margin-bottom:15px;">Apply for Loan</h2>
      <div class="form-group"><label>Amount ($)</label><input type="number" id="apply-amount" style="width:100%; padding:12px; border:1px solid #ddd; border-radius:8px;"></div>
      <button onclick="submitApply()" style="width:100%; padding:14px; background:var(--emerald); color:white; border:none; border-radius:8px; font-weight:600; margin-top:10px;">Submit</button>
      <button onclick="closeModal()" style="width:100%; padding:14px; background:transparent; border:none; font-weight:600; margin-top:5px;">Cancel</button>
      <div id="apply-msg" style="margin-top:10px; text-align:center;"></div>
    </div>
  </div>

  <div id="modal-transfer" class="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:white; padding:30px; border-radius:20px; width:90%; max-width:400px;">
      <h2 style="color:var(--deep-green); margin-bottom:15px;">Transfer Funds</h2>
      <div class="form-group"><label>Amount ($)</label><input type="number" id="transfer-amount" style="width:100%; padding:12px; border:1px solid #ddd; border-radius:8px;"></div>
      <div class="form-group">
        <label>Destination</label>
        <select id="transfer-dest" style="width:100%; padding:12px; border:1px solid #ddd; border-radius:8px;">
          <option value="checking">Internal Bank</option>
          <option value="external">External Bank</option>
        </select>
      </div>
      <button onclick="submitTransfer()" style="width:100%; padding:14px; background:var(--emerald); color:white; border:none; border-radius:8px; font-weight:600; margin-top:10px;">Transfer</button>
      <button onclick="closeModal()" style="width:100%; padding:14px; background:transparent; border:none; font-weight:600; margin-top:5px;">Cancel</button>
      <div id="transfer-msg" style="margin-top:10px; text-align:center;"></div>
    </div>
  </div>

  <div id="modal-repay" class="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:white; padding:30px; border-radius:20px; width:90%; max-width:400px;">
      <h2 style="color:var(--deep-green); margin-bottom:15px;">Repay Loan</h2>
      <div class="form-group"><label>Amount ($)</label><input type="number" id="repay-amount" style="width:100%; padding:12px; border:1px solid #ddd; border-radius:8px;"></div>
      <button onclick="submitRepay()" style="width:100%; padding:14px; background:var(--emerald); color:white; border:none; border-radius:8px; font-weight:600; margin-top:10px;">Repay</button>
      <button onclick="closeModal()" style="width:100%; padding:14px; background:transparent; border:none; font-weight:600; margin-top:5px;">Cancel</button>
      <div id="repay-msg" style="margin-top:10px; text-align:center;"></div>
    </div>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem("xanvia_user"));
    if(!user) window.location.replace("../index.html");
    const formatUSD = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(val);

    async function loadData() {
      const res = await fetch(`/api/accounts/${user.id}`);
      const data = await res.json();

      const loanBalance = data.loan || 0;
      
      const txRes = await fetch(`/api/transactions/${user.id}`);
      const txs = await txRes.json();
      
      let totalBorrowed = 0;
      let totalRepaid = 0;
      const loanTxs = txs.filter(tx => tx.type.includes('LOAN'));

      loanTxs.forEach(tx => {
        if (tx.type === 'LOAN_APPLICATION' && tx.status === 'Approved') totalBorrowed += parseFloat(tx.amount);
        if (tx.type === 'LOAN_REPAYMENT' && tx.status === 'Approved') totalRepaid += parseFloat(tx.amount);
      });

      document.getElementById('total-approved').textContent = formatUSD(totalBorrowed);
      document.getElementById('loan-balance').textContent = formatUSD(loanBalance);
      
      const outstandingDebt = totalBorrowed - totalRepaid;
      document.getElementById('total-debt').textContent = formatUSD(outstandingDebt > 0 ? outstandingDebt : 0);

      document.getElementById('history-list').innerHTML = loanTxs.map(tx => `
        <div class="tx-item">
          <div class="tx-info">
            <h4>${tx.type.replace('_', ' ')}</h4>
            <p>${new Date(tx.created_at).toLocaleDateString()}</p>
          </div>
          <div class="tx-amount" style="color:${tx.status === 'Approved' ? 'var(--emerald)' : 'var(--warning)'}">
            ${formatUSD(tx.amount)}
            <div style="font-size:0.7rem; color:var(--muted);">${tx.status}</div>
          </div>
        </div>
      `).join('') || '<p>No loan history.</p>';
    }

    function openModal(type) { document.getElementById(`modal-${type}`).style.display = 'flex'; }
    function closeModal() { document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none'); }

    async function submitApply() {
      const amount = parseFloat(document.getElementById('apply-amount').value);
      const msg = document.getElementById('apply-msg');
      const res = await fetch('/api/loans/apply', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: user.id, amount }) });
      const data = await res.json();
      msg.textContent = data.message || data.error; msg.style.color = data.success ? "var(--emerald)" : "red";
      if(data.success) setTimeout(() => { closeModal(); loadData(); }, 1500);
    }

    async function submitTransfer() {
      const amount = parseFloat(document.getElementById('transfer-amount').value);
      const dest = document.getElementById('transfer-dest').value;
      const msg = document.getElementById('transfer-msg');
      const res = await fetch('/api/loans/transfer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: user.id, amount, destination: dest }) });
      const data = await res.json();
      msg.textContent = data.message || data.error; msg.style.color = data.success ? "var(--emerald)" : "red";
      if(data.success) setTimeout(() => { closeModal(); loadData(); }, 1500);
    }

    async function submitRepay() {
      const amount = parseFloat(document.getElementById('repay-amount').value);
      const msg = document.getElementById('repay-msg');
      const res = await fetch('/api/loans/repay', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: user.id, amount }) });
      const data = await res.json();
      msg.textContent = data.message || data.error; msg.style.color = data.success ? "var(--emerald)" : "red";
      if(data.success) setTimeout(() => { closeModal(); loadData(); }, 1500);
    }

    loadData();
  </script>
</body>
</html>
