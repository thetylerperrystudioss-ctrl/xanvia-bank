<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dashboard | Xanvia Credit Union</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/dashboard.css">
  <style>
    .app-header { padding: 20px 20px 50px; border-radius: 0 0 30px 30px; text-align: center; position: relative; background: linear-gradient(160deg, #11553F 0%, #0A2E23 100%); color: white; }
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .menu-icon-btn { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
    
    /* SIDEBAR & PROFILE */
    .sidebar { position: fixed; top: 0; left: -350px; width: 320px; height: 100vh; background: white; z-index: 3000; transition: 0.3s ease; box-shadow: 2px 0 10px rgba(0,0,0,0.1); padding: 20px; display: flex; flex-direction: column; overflow-y: auto; }
    .sidebar.open { left: 0; }
    .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2500; display: none; }
    .sidebar-overlay.open { display: block; }
    
    .profile-section { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
    .profile-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; background: #eee; margin: 0 auto 10px; display: block; border: 3px solid var(--emerald); }
    .profile-name { font-size: 1.2rem; font-weight: 700; color: var(--deep-green); }
    .profile-username { font-size: 0.85rem; color: var(--muted); margin-bottom: 15px; }
    
    .account-card { background: #F4F7F6; border: 1px dashed var(--emerald); padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
    .acc-label { font-size: 0.7rem; text-transform: uppercase; font-weight: 700; color: var(--muted); }
    .acc-number { font-size: 1.4rem; font-weight: 800; color: var(--deep-green); letter-spacing: 1px; }
    .acc-routing { font-size: 0.8rem; color: var(--muted); margin-top: 5px; }
    
    .info-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.9rem; }
    .info-row span:first-child { color: var(--muted); font-weight: 600; }
    .info-row span:last-child { font-weight: 700; color: var(--text); word-break: break-all; text-align: right; max-width: 60%; }

    .edit-profile-btn { background: var(--emerald); color: white; padding: 10px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; margin-top: auto; margin-bottom: 10px; }
    .logout-btn { background: #FEE2E2; color: #991B1B; padding: 10px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; }

    /* MODAL FOR EDITING */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 4000; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal-content { background: white; width: 100%; max-width: 400px; padding: 25px; border-radius: 20px; }
    .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
    .form-group label { font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; }
    .form-group input { padding: 12px; border: 1px solid #ddd; border-radius: 8px; }

    /* Transaction styles */
    .tx-item { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #eee; }
    .tx-amount.credit { color: var(--emerald); }
    .tx-amount.debit { color: #D32F2F; }
  </style>
</head>
<body class="mobile-app-body">
  
  <!-- SIDEBAR -->
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
  <div class="sidebar" id="sidebar">
    <div class="profile-section">
      <img src="" id="prof-pic-img" class="profile-img" alt="Profile">
      <div class="profile-name" id="prof-name">Loading...</div>
      <div class="profile-username" id="prof-user">@loading</div>
    </div>
    
    <div class="account-card">
      <div class="acc-label">Account Number</div>
      <div class="acc-number" id="prof-acc-num">0000000000</div>
      <div class="acc-routing">Routing: <span id="prof-rout-num">000000000</span></div>
    </div>

    <div class="info-row"><span>Phone</span> <span id="prof-phone">Loading...</span></div>
    <div class="info-row"><span>Email</span> <span id="prof-email">Loading...</span></div>
    
    <button class="edit-profile-btn" onclick="openEditModal()">Edit Profile</button>
    <button class="logout-btn" onclick="logout()">Log Out</button>
  </div>

  <!-- EDIT PROFILE MODAL -->
  <div id="edit-modal" class="modal-overlay">
    <div class="modal-content">
      <h3 style="color:var(--deep-green); margin-bottom:15px;">Edit Profile</h3>
      <div class="form-group"><label>Full Name</label><input type="text" id="edit-name"></div>
      <div class="form-group"><label>Username</label><input type="text" id="edit-username"></div>
      <div class="form-group"><label>Phone</label><input type="text" id="edit-phone"></div>
      <div class="form-group"><label>Profile Picture</label><input type="file" id="edit-pic" accept="image/*"></div>
      <button onclick="saveProfile()" style="width:100%; padding:14px; background:var(--emerald); color:white; border:none; border-radius:8px; font-weight:600;">Save Changes</button>
      <button onclick="document.getElementById('edit-modal').classList.remove('open')" style="width:100%; padding:14px; background:none; border:none; font-weight:600; margin-top:5px;">Cancel</button>
    </div>
  </div>

  <header class="app-header">
    <div class="top-nav">
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="menu-icon-btn" onclick="toggleSidebar()">☰</button>
        <div class="logo">
          <div class="logo-icon">X</div>
          <div class="logo-text"><span class="logo-title">Xanvia</span><span class="logo-subtitle">Credit Union</span></div>
        </div>
      </div>
    </div>
    <div class="balance-section">
      <h1 class="balance-amount" id="total-balance">$0.00</h1>
      <p class="balance-label">Available Checking Balance</p>
    </div>
    
    <div class="quick-actions">
      <a href="hub.html" class="action-btn"><div class="icon-circle">⚙️</div><span>Manage</span></a>
      <a href="transfer.html" class="action-btn"><div class="icon-circle">↗</div><span>Transfer</span></a>
      <a href="deposit.html?target=checking" class="action-btn"><div class="icon-circle">+</div><span>Deposit</span></a>
      <a href="#" class="action-btn"><div class="icon-circle">💳</div><span>Cards</span></a>
    </div>
  </header>

  <main class="app-main" style="padding-top: 50px;">
    <div class="search-bar"><span>🔍</span><input type="text" id="search-input" placeholder="Search Transactions" onkeyup="filterTransactions()"></div>
    <div class="transaction-container" id="transaction-list"></div>
  </main>

  <script>
    const user = JSON.parse(localStorage.getItem("xanvia_user"));
    if (!user) window.location.replace("../index.html");
    
    function logout() { localStorage.removeItem("xanvia_user"); window.location.replace("../index.html"); }
    const formatUSD = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(val);

    let allTransactions = [];
    let currentBalance = 0;

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebar-overlay').classList.toggle('open');
      if (document.getElementById('sidebar').classList.contains('open')) fetchUserData();
    }

    async function fetchUserData() {
      const res = await fetch(`/api/user/${user.id}`);
      const data = await res.json();
      
      document.getElementById('prof-name').textContent = data.name;
      document.getElementById('prof-user').textContent = '@' + data.username;
      document.getElementById('prof-acc-num').textContent = data.account_number || 'N/A';
      document.getElementById('prof-rout-num').textContent = data.routing_number || 'N/A';
      document.getElementById('prof-phone').textContent = data.phone || 'N/A';
      document.getElementById('prof-email').textContent = data.email;
      if(data.profile_pic) document.getElementById('prof-pic-img').src = data.profile_pic;
    }

    function openEditModal() {
      document.getElementById('edit-name').value = document.getElementById('prof-name').textContent;
      document.getElementById('edit-username').value = document.getElementById('prof-user').textContent.replace('@', '');
      document.getElementById('edit-phone').value = document.getElementById('prof-phone').textContent === 'N/A' ? '' : document.getElementById('prof-phone').textContent;
      document.getElementById('edit-modal').classList.add('open');
    }

    async function saveProfile() {
      const name = document.getElementById('edit-name').value;
      const username = document.getElementById('edit-username').value;
      const phone = document.getElementById('edit-phone').value;
      const pic = document.getElementById('edit-pic').files[0];

      const formData = new FormData();
      formData.append('userId', user.id);
      formData.append('name', name);
      formData.append('username', username);
      formData.append('phone', phoneincludes);
      if(pic) formData.append('(queryprofile_pic', pic);

      const res = await)
 fetch('/api/user/update', { method: 'POST',      body: formData });
      const data = await res.json();
 );
      
      if(data.success) {
        alert("Profile updated!");
             document.getElementById('edit-modal').classList.remove('open');
        fetchUserData();
      } else {
        alert(data.error);
      }
    }

    async function loadDashboard(isPolling = false) {
      try {
        const res = await fetch(`/api/accounts/${user.id}`);
        const data = await res.json();
        
        const newBalance = parseFloat(data.checking) || 0;
        document.getElementById('total-balance').textContent = formatUSD(newBalance);
        currentBalance = newBalance;
        
        const txRes = await fetch(`/api/transactions/${user.id}`);
        const txs = await txRes.json();
        
        // FILTER: ONLY show main dashboard transactions (Hide loans, investments)
        allTransactions = txs.filter(tx => 
          !tx.type.includes('INVESTMENT') && 
          !tx.type.includes('LOAN')
        );

        renderTransactions(allTransactions);
      } catch (err) { console.error(err); }
    }

    function renderTransactions(txs) {
      const list = document.getElementById('transaction-list');
      if (txs.length === 0) {
        list.innerHTML = '<p style="text-align:center; color:#888; padding:20px;">No transactions.</p>';
        return;
      }

      list.innerHTML = txs.map(tx => {
        const isCredit = tx.type.includes('DEPOSIT') && !tx.type.includes('INTERNAL');
        const amountClass = isCredit ? 'credit' : 'debit';
        const safeAmount = parseFloat(tx.amount) || 0;
        
        let icon = '🔄';
        if (tx.type.includes('DEPOSIT')) icon = '💵';
        if (tx.type.includes('WITHDRAWAL')) icon = '💸';
        if (tx.type === 'FEE') icon = '⚠️';
        if (tx.type === 'INTERNAL_TRANSFER') icon = '↗️';

        return `
          <div class="tx-item">
            <div class="tx-icon" style="width:40px; height:40px; background:#F4F7F6; border-radius:50%; display:flex; align-items:center; justify-content:center;">${icon}</div>
            <div class="tx-details" style="flex:1; margin-left:15px; text-align:left;">
              <h4 style="font-size:0.9rem; margin:0;">${tx.type.replace(/_/g, ' ')}</h4>
              <p style="font-size:0.75rem; color:#888; margin:0;">${new Date(tx.created_at).toLocaleDateString()}</p>
            </div>
            <div class="tx-amount ${amountClass}">
              ${isCredit ? '+' : '-'}${formatUSD(safeAmount)}
            </div>
          </div>
        `;
      }).join('');
    }

    function filterTransactions() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = allTransactions.filter(tx => 
        tx.type.toLowerCase().includes(query) || 
        tx.amount.toString(). renderTransactions(filtered);
    }

    loadDashboard();
    setInterval(loadDashboard, 5000);
  </script>
</body>
</html>
