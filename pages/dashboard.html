<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dashboard | Xanvia Bank</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body class="mobile-app-body">

  <!-- TOP GREEN HEADER -->
  <header class="app-header">
    <div class="header-tabs">
      <span class="active">Personal</span>
      <span>Business</span>
      <span>Family</span>
    </div>

    <div class="balance-section">
      <h1 class="balance-amount" id="total-balance">$0.00</h1>
      <p class="balance-label">Available Balance</p>
    </div>

    <!-- FLOATING ACTION BUTTONS -->
    <div class="quick-actions">
      <button class="action-btn" onclick="window.location.href='hub.html'">
        <div class="icon-circle">⚙️</div>
        <span>Manage</span>
      </button>
      <button class="action-btn" onclick="window.location.href='withdraw.html'">
        <div class="icon-circle">↗</div>
        <span>Transfer</span>
      </button>
      <button class="action-btn" onclick="window.location.href='deposit.html'">
        <div class="icon-circle">+</div>
        <span>Deposit</span>
      </button>
    </div>
  </header>

  <!-- MAIN CONTENT (White area) -->
  <main class="app-main">
    
    <!-- SEARCH -->
    <div class="search-bar">
      <span>🔍</span>
      <input type="text" placeholder="Search Transactions">
    </div>

    <!-- CATEGORY FILTERS -->
    <div class="category-filters">
      <button class="filter-btn active">All</button>
      <button class="filter-btn">Food</button>
      <button class="filter-btn">Entertainment</button>
      <button class="filter-btn">Hobby</button>
      <button class="filter-btn">Income</button>
    </div>

    <!-- TRANSACTIONS LIST -->
    <div class="transaction-container" id="transaction-list">
      <!-- Transactions will be injected here by JS -->
    </div>

  </main>

  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">
    <a href="#" class="nav-item">
      <span class="icon">💳</span>
      <span class="label">Payments</span>
    </a>
    <a href="#" class="nav-item">
      <span class="icon">📊</span>
      <span class="label">Spending</span>
    </a>
    <a href="dashboard.html" class="nav-item active">
      <span class="icon">🏠</span>
      <span class="label">Home</span>
    </a>
    <a href="#" class="nav-item">
      <span class="icon">💳</span>
      <span class="label">Cards</span>
    </a>
    <a href="#" class="nav-item">
      <span class="icon">🧩</span>
      <span class="label">Spaces</span>
    </a>
  </nav>

  <script>
    const user = JSON.parse(localStorage.getItem("xanvia_user"));
    if (!user) window.location.href = "login.html";

    // Format currency
    const formatUSD = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(val);

    // Load Data
    async function loadDashboard() {
      try {
        const res = await fetch(`/api/accounts/${user.id}`);
        const data = await res.json();
        
        // Calculate Total Available (Checking + Savings)
        const checking = data.checking || 0;
        const savings = data.savings || 0;
        const total = checking + savings;

        document.getElementById('total-balance').textContent = formatUSD(total);

        // Fetch Transactions
        const txRes = await fetch(`/api/transactions/${user.id}`);
        const txs = await txRes.json();
        
        renderTransactions(txs);

      } catch (err) { console.error(err); }
    }

    function renderTransactions(txs) {
      const container = document.getElementById('transaction-list');
      
      if (!txs || txs.length === 0) {
        container.innerHTML = `<p style="text-align:center; color:var(--muted); padding: 20px;">No transactions yet.</p>`;
        return;
      }

      // Group by Month (Mocking it for this month)
      let html = `
        <div class="month-header">
          <span>Recent Activity</span>
          <span class="spent-text">Transactions</span>
        </div>
      `;

      txs.forEach(tx => {
        const isCredit = tx.type.includes('DEPOSIT') || tx.type.includes('LOAN');
        const amountClass = isCredit ? 'credit' : 'debit';
        const sign = isCredit ? '+' : '-';
        const icon = tx.type === 'DEPOSIT' ? '⬇️' : tx.type === 'WITHDRAWAL' ? '⬆️' : '🔄';
        
        // Date formatting
        const date = new Date(tx.created_at);
        const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const dateStr = date.toLocaleDateString([], { month: '2-digit', day: '2-digit' });

        html += `
          <div class="tx-item">
            <div class="tx-icon">${icon}</div>
            <div class="tx-details">
              <h4>${tx.type.replace('_', ' ')}</h4>
              <p>${timeStr} • ${dateStr}</p>
            </div>
            <div class="tx-amount ${amountClass}">
              ${sign}${formatUSD(parseFloat(tx.amount))}
              <span class="tx-status">${tx.status}</span>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    loadDashboard();
  </script>
</body>
</html>
