<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Portal | Xanvia Credit Union</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --emerald: #0F8A5F; --deep-green: #0B2E23; --bg: #F4F7F6; --text: #1A1A1A; --muted: #6B7280; --border: #E5E7EB; --danger: #EF4444; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; }

    .app-container { width: 100%; max-width: 600px; padding: 20px; padding-bottom: 80px; }
    #dashboard-area { display: none; }

    #login-overlay { position: fixed; inset: 0; background: var(--deep-green); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    .login-box { background: white; padding: 40px; border-radius: 20px; text-align: center; width: 90%; max-width: 400px; }
    .login-box h2 { color: var(--deep-green); margin-bottom: 10px; }
    .login-box input { width: 100%; padding: 16px; border: 1px solid #ddd; border-radius: 10px; font-size: 1.5rem; text-align: center; letter-spacing: 8px; margin-bottom: 20px; }
    .login-box button { width: 100%; padding: 16px; background: var(--emerald); color: white; border: none; border-radius: 10px; font-weight: 600; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; }
    .tab { background: white; border: 1px solid var(--border); padding: 10px 20px; border-radius: 20px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .tab.active { background: var(--deep-green); color: white; border-color: var(--deep-green); }
    .view-section { display: none; }
    .view-section.active { display: block; }
    .panel { background: white; border-radius: 16px; padding: 20px; border: 1px solid var(--border); }

    .req-item { display: flex; flex-direction: column; padding: 15px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; background: #FAFAFA; }
    .proof-img { width: 100%; max-width: 200px; border-radius: 8px; border: 1px solid #ddd; margin-top: 10px; display: block; }
    .btn-approve { background: var(--emerald); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 600; flex: 1; }
    .btn-reject { background: var(--danger); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 600; flex: 1; }
    .btn-outline { background: white; border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.75rem; }
    .btn-notify { background: #F3F4F6; border: 1px solid #D1D5DB; color: #374151; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.75rem; }
    .btn-delete { background: #FEE2E2; border: 1px solid #F87171; color: #991B1B; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.75rem; }

    .chat-box { background: #F4F7F6; border-radius: 12px; padding: 15px; margin-top: 10px; display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; line-height: 1.4; }
    .msg.user { background: #E5E7EB; color: var(--text); align-self: flex-start; border-bottom-left-radius: 2px; }
    .msg.admin { background: var(--emerald); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg-time { font-size: 0.65rem; opacity: 0.7; margin-top: 4px; display: block; }

    .user-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px; }
    .user-info h4 { font-size: 0.95rem; color: var(--deep-green); margin-bottom: 2px; }
    .user-info p { font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
    .user-status { font-weight: 700; font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-top: 5px;}
    .user-status.active { background: #D1FAE5; color: #065F46; }
    .user-status.frozen { background: #FEE2E2; color: #991B1B; }
    .user-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; outline: none; }
    .btn-save { width: 100%; padding: 14px; background: var(--emerald); color: white; border: none; border-radius: 8px; font-weight: 600; margin-top: 10px; cursor: pointer; }
  </style>
</head>
<body>

  <div id="login-overlay">
    <div class="login-box">
      <h2 style="color:var(--deep-green); margin-bottom:10px;">Admin Access</h2>
      <input type="password" id="admin-pass" maxlength="4" placeholder="••••">
      <button onclick="verifyPasscode()">Unlock</button>
    </div>
  </div>

  <div id="dashboard-area" class="app-container">
    <div class="header">
      <h1>Admin Panel</h1>
      <button onclick="window.location.replace('../index.html')" style="background:none; border:none; font-weight:600; color:var(--emerald);">Exit</button>
    </div>

    <div class="tabs">
      <div class="tab active" id="tab-requests" onclick="switchTab('requests')">Requests</div>
      <div class="tab" id="tab-users" onclick="switchTab('users')">Users</div>
      <div class="tab" id="tab-complaints" onclick="switchTab('complaints')">Complaints</div>
      <div class="tab" id="tab-cards" onclick="switchTab('cards')">Cards</div>
      <div class="tab" id="tab-notify" onclick="switchTab('notify')">Broadcast</div>
      <div class="tab" id="tab-settings" onclick="switchTab('settings')">Settings</div>
    </div>

    <div id="view-requests" class="view-section active">
      <div class="panel"><h2 style="margin-bottom:15px;">Pending Approvals</h2><div id="req-list"></div></div>
    </div>

    <div id="view-users" class="view-section">
      <div class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
          <h2>Registered Users</h2>
          <button class="btn-save" onclick="switchTab('notify')" style="width:auto; padding:8px 12px; font-size:0.8rem; margin:0;">Notify All</button>
        </div>
        <div id="user-list"></div>
      </div>
    </div>

    <div id="view-complaints" class="view-section">
      <div class="panel"><h2 style="margin-bottom:15px;">Support Tickets</h2><div id="complaint-list"></div></div>
    </div>

    <div id="view-cards" class="view-section">
      <div class="panel"><h2 style="margin-bottom:15px;">Card Requests</h2><div id="card-list"></div></div>
    </div>

    <div id="view-notify" class="view-section">
      <div class="panel">
        <h2 style="margin-bottom:15px;">Send Notification</h2>
        <div class="form-group">
          <label>Recipient</label>
          <select id="notify-target"><option value="all">All Users (Broadcast)</option></select>
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea id="notify-message" rows="4" placeholder="Type your notification here..."></textarea>
        </div>
        <button class="btn-save" onclick="sendNotification()">Send Notification</button>
        <p id="notify-msg" style="text-align:center; margin-top:10px; font-weight:bold; font-size:0.85rem;"></p>
      </div>
    </div>

    <div id="view-settings" class="view-section">
      <div class="panel">
        <h2 style="margin-bottom:15px;">Deposit Bank Settings</h2>
        <div class="form-group"><label>Bank Name</label><input type="text" id="set-bank-name"></div>
        <div class="form-group"><label>Account Number</label><input type="text" id="set-bank-account"></div>
        <div class="form-group"><label>Routing Number</label><input type="text" id="set-bank-routing"></div>
        <div class="form-group" style="margin-top: 20px;"><label>Bitcoin Wallet Address</label><input type="text" id="set-btc"></div>
        <button class="btn-save" onclick="saveSettings()">Save Settings</button>
        <p id="settings-msg" style="text-align:center; margin-top:10px; font-weight:bold; font-size:0.85rem;"></p>
      </div>
    </div>
  </div>

  <script>
    function verifyPasscode() {
      if (document.getElementById('admin-pass').value === "@@@@") {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('dashboard-area').style.display = 'block';
        loadRequests();
      } else { alert("Access Denied"); }
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).classList.add('active');
      document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
      document.getElementById(`view-${tabName}`).classList.add('active');

      if (tabName === 'requests') loadRequests();
      if (tabName === 'users') loadUsers();
      if (tabName === 'complaints') loadComplaints();
      if (tabName === 'cards') loadAdminCards();
      if (tabName === 'notify') loadNotifyDropdown();
      if (tabName === 'settings') loadSettings();
    }

    async function loadRequests() {
      const requests = await (await fetch('/api/admin/requests')).json();
      document.getElementById('req-list').innerHTML = requests.length > 0 ? requests.map(tx => `
        <div class="req-item">
          <h4>${tx.name} (${tx.email})</h4>
          <p>Type: ${tx.type.replace(/_/g, ' ')} | Amount: $${parseFloat(tx.amount).toFixed(2)}</p>
          ${tx.reference ? `<p>Reference: <strong>${tx.reference}</strong></p>` : ''}
          ${tx.proof_image ? `<a href="${tx.proof_image}" target="_blank"><img src="${tx.proof_image}" class="proof-img"></a>` : ''}
          <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button class="btn-approve" onclick="approveReq(${tx.id}, 'approve')">Approve</button>
            <button class="btn-reject" onclick="approveReq(${tx.id}, 'reject')">Reject</button>
          </div>
        </div>
      `).join('') : '<p style="color:var(--muted);">No pending requests.</p>';
    }

    async function approveReq(id, action) {
      await fetch('/api/admin/approve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ txId: id, action }) });
      loadRequests();
    }

    async function loadUsers() {
      const data = await (await fetch('/api/admin/users')).json();
      document.getElementById('user-list').innerHTML = data.length > 0 ? data.map(u => `
        <div class="user-row">
          <div class="user-info">
            <h4>${u.name} (@${u.username})</h4>
            <p>${u.email}</p>
            <span class="user-status ${u.status === 'Active' ? 'active' : 'frozen'}">${u.status}</span>
          </div>
          <div class="user-actions">
            <button class="btn-notify" onclick="promptNotify('${u.id}')">Notify</button>
            <button class="btn-outline" onclick="freezeUser(${u.id}, '${u.status}')">${u.status === 'Active' ? 'Freeze' : 'Unfreeze'}</button>
            <button class="btn-delete" onclick="deleteUser(${u.id})">Delete</button>
          </div>
        </div>
      `).join('') : '<p style="color:var(--muted);">No users found.</p>';
    }

    async function freezeUser(id, currentStatus) {
      const newStatus = currentStatus === 'Active' ? 'Frozen' : 'Active';
      await fetch('/api/admin/freeze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: id, status: newStatus }) });
      loadUsers();
    }

    async function deleteUser(id) {
      if (!confirm("Are you sure you want to delete this user?")) return;
      await fetch(`/api/admin/users/${id}`, { method: 'DELETE' });
      loadUsers();
    }

    async function promptNotify(userId) {
      const message = prompt("Enter notification message for this user:");
      if (!message) return;
      await fetch('/api/admin/notify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ target: userId, message }) });
      alert("Notification sent successfully!");
    }

    async function loadNotifyDropdown() {
      const data = await (await fetch('/api/admin/users')).json();
      const select = document.getElementById('notify-target');
      select.innerHTML = '<option value="all">All Users (Broadcast)</option>' + data.map(u => `<option value="${u.id}">${u.name} (${u.email})</option>`).join('');
    }

    async function sendNotification() {
      const target = document.getElementById('notify-target').value;
      const message = document.getElementById('notify-message').value;
      const msg = document.getElementById('notify-msg');
      if (!message) { msg.textContent = "Enter a message."; msg.style.color = "var(--danger)"; return; }
      msg.textContent = "Sending..."; msg.style.color = "var(--muted)";
      const res = await fetch('/api/admin/notify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ target, message }) });
      if (res.ok) { msg.textContent = "✅ Notification sent!"; msg.style.color = "var(--emerald)"; document.getElementById('notify-message').value = ''; }
      else { msg.textContent = "❌ Failed to send."; msg.style.color = "var(--danger)"; }
      setTimeout(() => msg.textContent = "", 3000);
    }

    async function loadComplaints() {
      const complaints = await (await fetch('/api/admin/complaints')).json();
      document.getElementById('complaint-list').innerHTML = complaints.length > 0 ? complaints.map(c => `
        <div class="req-item">
          <h4>${c.subject} (${c.ref_number})</h4>
          <p>From: ${c.name} | Category: ${c.category}</p>
          <div class="chat-box" id="admin-chat-${c.id}"><p style="text-align:center; font-size:0.8rem; color:#888;">Loading chat...</p></div>
          <p style="margin-top:10px;">Status: <strong>${c.status}</strong></p>
          ${c.status !== 'Resolved' ? `
          <div style="display: flex; gap: 10px; margin-top: 10px;">
            <input type="text" id="admin-reply-${c.id}" placeholder="Type reply..." style="flex:1; padding:10px; border:1px solid #ddd; border-radius:6px;">
            <button class="btn-approve" onclick="sendAdminReply(${c.id})" style="flex:0 0 auto; padding: 10px 20px;">Send</button>
          </div>` : ''}
        </div>
      `).join('') : '<p style="color:var(--muted);">No complaints.</p>';
      complaints.forEach(c => { if(c.status !== 'Resolved') loadAdminChat(c.id); });
    }

    async function loadAdminChat(complaintId) {
      const container = document.getElementById(`admin-chat-${complaintId}`);
      if (!container) return;
      const res = await fetch(`/api/chat/${complaintId}`);
      const messages = await res.json();
      container.innerHTML = messages.map(m => `
        <div class="msg ${m.sender}">
          ${m.message}
          <span class="msg-time">${new Date(m.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
        </div>
      `).join('');
      container.scrollTop = container.scrollHeight;
    }

    async function sendAdminReply(complaintId) {
      const input = document.getElementById(`admin-reply-${complaintId}`);
      const message = input.value.trim();
      if (!message) return;
      input.value = "";
      await fetch(`/api/admin/chat/${complaintId}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message }) });
      loadAdminChat(complaintId);
      setTimeout(loadComplaints, 500);
    }

    // ==========================================
    // ADMIN — CARDS
    // ==========================================
    async function loadAdminCards() {
      const cards = await (await fetch('/api/admin/cards')).json();
      document.getElementById('card-list').innerHTML = cards.length > 0 ? cards.map(c => `
        <div class="req-item">
          <h4>${c.name} (${c.email})</h4>
          <p>Type: <strong>${c.card_type}</strong> • Last4: **** ${c.last4 || '0000'}</p>
          <p>Status: <strong style="color:${c.status === 'Active' ? '#0F8A5F' : c.status === 'Rejected' ? '#EF4444' : '#F59E0B'}">${c.status}</strong></p>
          <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button class="btn-approve" onclick="setCardStatus(${c.id}, 'Active')">Activate</button>
            <button class="btn-reject" onclick="setCardStatus(${c.id}, 'Rejected')">Reject</button>
          </div>
        </div>
      `).join('') : '<p style="color:var(--muted);">No card requests.</p>';
    }

    async function setCardStatus(id, status) {
      await fetch(`/api/admin/cards/${id}/status`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      loadAdminCards();
    }

    async function loadSettings() {
      const data = await (await fetch('/api/admin/settings')).json();
      document.getElementById('set-bank-name').value = data.bank_name || '';
      document.getElementById('set-bank-account').value = data.bank_account || '';
      document.getElementById('set-bank-routing').value = data.bank_routing || '';
      document.getElementById('set-btc').value = data.btc_address || '';
    }

    async function saveSettings() {
      const msg = document.getElementById('settings-msg');
      msg.textContent = "Saving..."; msg.style.color = "var(--muted)";
      const payload = {
        bank_name: document.getElementById('set-bank-name').value,
        bank_account: document.getElementById('set-bank-account').value,
        bank_routing: document.getElementById('set-bank-routing').value,
        btc_address: document.getElementById('set-btc').value
      };
      const res = await fetch('/api/admin/settings/update', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const result = await res.json();
      if (result.success) { msg.textContent = "✅ Settings updated!"; msg.style.color = "var(--emerald)"; }
      else { msg.textContent = "❌ Failed to update."; msg.style.color = "var(--danger)"; }
      setTimeout(() => msg.textContent = "", 3000);
    }
  </script>
</body>
</html>
