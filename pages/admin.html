<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Control | Xanvia Credit Union</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --emerald: #0F8A5F; --deep-green: #0B2E23; --bg: #F4F7F6; --text: #1A1A1A; --muted: #6B7280; --border: #E5E7EB; --danger: #EF4444; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; }

    #login-overlay { position: fixed; inset: 0; background: var(--deep-green); z-index: 9999; display: flex; align-items: center; justify-content: center; }
    .login-box { background: white; padding: 40px; border-radius: 20px; text-align: center; width: 90%; max-width: 400px; }
    .login-box h2 { color: var(--deep-green); margin-bottom: 10px; }
    .login-box input { width: 100%; padding: 16px; border: 1px solid #ddd; border-radius: 10px; font-size: 1.5rem; text-align: center; letter-spacing: 8px; margin-bottom: 20px; }
    .login-box button { width: 100%; padding: 16px; background: var(--emerald); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }

    .layout { display: flex; min-height: 100vh; }
    .sidebar { width: 260px; background: #0B2E23; color: white; padding: 20px 0; display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: -280px; z-index: 1000; transition: left 0.3s; }
    .sidebar.open { left: 0; }
    .brand { font-size: 1.4rem; font-weight: 700; padding: 0 20px; margin-bottom: 30px; display: flex; align-items: center; gap: 8px; }
    .brand span { background: var(--emerald); padding: 4px 8px; border-radius: 4px; font-size: 1rem; }
    .nav-item { padding: 12px 20px; color: #A7C4B7; font-size: 0.9rem; cursor: pointer; }
    .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); color: white; border-left: 3px solid var(--emerald); }
    .logout-btn { margin: auto 20px 20px; padding: 12px; background: transparent; border: 1px solid rgba(255,255,255,0.3); color: white; border-radius: 8px; cursor: pointer; font-weight: 600; }

    .main-content { flex: 1; padding: 20px; margin-left: 0; }
    .top-bar { background: white; padding: 15px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .mobile-menu-btn { display: block; background: none; border: none; font-size: 1.5rem; cursor: pointer; }
    .top-bar h1 { font-size: 1.2rem; color: var(--deep-green); }

    .panel { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .panel-title { font-size: 1.1rem; font-weight: 700; color: var(--deep-green); margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    
    .req-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 15px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; background: #FAFAFA; }
    .req-info h4 { font-size: 0.95rem; margin-bottom: 5px; color: var(--deep-green); }
    .req-info p { font-size: 0.85rem; color: var(--text); margin-bottom: 4px; }
    .btn-approve { background: var(--emerald); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; margin-right: 5px; }
    .btn-reject { background: var(--danger); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }

    .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; display: none; }
    .sidebar-overlay.open { display: block; }

    @media (min-width: 1024px) {
      .sidebar { left: 0; }
      .main-content { margin-left: 260px; padding: 30px; }
      .mobile-menu-btn { display: none; }
    }
  </style>
</head>
<body>

  <div id="login-overlay">
    <div class="login-box">
      <h2>Admin Access</h2>
      <input type="password" id="admin-pass" maxlength="4" placeholder="••••">
      <button onclick="verifyPasscode()">Unlock</button>
    </div>
  </div>

  <div class="sidebar-overlay" id="overlay" onclick="toggleMenu()"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span>X</span> Xanvia</div>
      <div class="nav-item active">Dashboard</div>
      <div class="nav-item">Pending Requests</div>
      <div class="nav-item">User Management</div>
      <button class="logout-btn" onclick="logoutAdmin()">Secure Logout</button>
    </aside>

    <main class="main-content">
      <header class="top-bar">
        <button class="mobile-menu-btn" onclick="toggleMenu()">☰</button>
        <h1>Admin Portal</h1>
      </header>

      <div class="panel">
        <div class="panel-title">Pending Requests (Deposits, Loans, Withdrawals)</div>
        <div id="req-list">Loading...</div>
      </div>

      <div class="panel">
        <div class="panel-title">Payment Settings</div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
          <input type="text" id="bank-name" placeholder="Bank Name" style="padding:10px; border:1px solid #ddd; border-radius:6px;">
          <input type="text" id="bank-account" placeholder="Account Number" style="padding:10px; border:1px solid #ddd; border-radius:6px;">
          <input type="text" id="bank-routing" placeholder="Routing Number" style="padding:10px; border:1px solid #ddd; border-radius:6px;">
          <input type="text" id="btc-address" placeholder="BTC Address" style="padding:10px; border:1px solid #ddd; border-radius:6px;">
        </div>
        <button class="btn-approve" onclick="saveSettings()" style="width: 100%;">Save Settings</button>
      </div>

    </main>
  </div>

  <script>
    function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('open'); }
    
    function verifyPasscode() {
      if (document.getElementById('admin-pass').value === "@@@@") {
        document.getElementById('login-overlay').style.display = 'none';
        loadData();
      } else { alert("Access Denied"); }
    }
    function logoutAdmin() { document.getElementById('login-overlay').style.display = 'flex'; }

    async function loadData() {
      const settings = await (await fetch('/api/admin/settings')).json();
      document.getElementById('bank-name').value = settings.bank_name || '';
      document.getElementById('bank-account').value = settings.bank_account || '';
      document.getElementById('bank-routing').value = settings.bank_routing || '';
      document.getElementById('btc-address').value = settings.btc_address || '';

      const requests = await (await fetch('/api/admin/requests')).json();
      document.getElementById('req-list').innerHTML = requests.map(tx => `
        <div class="req-item">
          <div class="req-info">
            <h4>${tx.name} (${tx.email})</h4>
            <p><strong>Type:</strong> ${tx.type}</p>
            <p><strong>Amount:</strong> $${parseFloat(tx.amount).toFixed(2)}</p>
            ${tx.reference ? `<p><strong>Ref:</strong> ${tx.reference}</p>` : ''}
          </div>
          <div>
            <button class="btn-approve" onclick="approve(${tx.id}, 'approve')">Approve</button>
            <button class="btn-reject" onclick="approve(${tx.id}, 'reject')">Reject</button>
          </div>
        </div>
      `).join('') || '<p style="color:var(--muted);">No pending requests.</p>';
    }

    async function saveSettings() {
      await fetch('/api/admin/update-settings', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          bank_name: document.getElementById('bank-name').value,
          bank_account: document.getElementById('bank-account').value,
          bank_routing: document.getElementById('bank-routing').value,
          btc_address: document.getElementById('btc-address').value
        })
      });
      alert("Settings Saved!");
    }

    async function approve(id, action) {
      await fetch('/api/admin/approve', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ txId: id, action })
      });
      loadData();
    }

    loadData();
  </script>
</body>
</html>
