<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal | Xanvia</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --emerald: #0F8A5F; --danger: #EF4444; --warning: #F59E0B; --deep-green: #0B2E23; --bg: #F4F7F6; --border: #E5E7EB; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: #111827; display: flex; min-height: 100vh; }
    
    /* Secure Login Overlay */
    #login-overlay { position: fixed; inset: 0; background: var(--deep-green); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    .login-box { background: white; padding: 40px; border-radius: 12px; text-align: center; width: 100%; max-width: 400px; }
    .login-box input { width: 100%; padding: 15px; border: 1px solid var(--border); border-radius: 8px; font-size: 1.2rem; text-align: center; letter-spacing: 5px; margin-bottom: 15px; }
    .login-box button { width: 100%; padding: 15px; background: var(--emerald); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    
    .sidebar { width: 240px; background: var(--deep-green); color: white; position: fixed; top: 0; bottom: 0; left: 0; padding: 20px 0; }
    .brand { font-size: 1.4rem; font-weight: 700; padding: 0 20px; margin-bottom: 30px; }
    .nav-item { padding: 12px 20px; color: #A7C4B7; cursor: pointer; }
    .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); color: white; border-left: 3px solid var(--emerald); }
    
    .main-content { margin-left: 240px; flex: 1; padding: 30px; }
    .panel { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .panel-title { font-size: 1.2rem; font-weight: 600; color: var(--deep-green); margin-bottom: 20px; }
    
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: var(--bg); }
    
    .btn-approve { background: var(--emerald); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    .btn-reject { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    .form-input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div id="login-overlay">
    <div class="login-box">
      <h2>Admin Passcode</h2>
      <input type="password" id="admin-pass" maxlength="4" placeholder="••••">
      <button onclick="verifyPasscode()">Unlock</button>
    </div>
  </div>

  <aside class="sidebar">
    <div class="brand">Admin</div>
    <a class="nav-item active" onclick="showAdminTab('requests')">Pending Requests</a>
    <a class="nav-item" onclick="showAdminTab('settings')">Payment Settings</a>
  </aside>

  <main class="main-content">
    
    <!-- PENDING REQUESTS TAB -->
    <div id="admin-tab-requests">
      <div class="panel">
        <div class="panel-title">Verification Queue</div>
        <table>
          <thead><tr><th>User</th><th>Type</th><th>Amount</th><th>Details</th><th>Actions</th></tr></thead>
          <tbody id="request-table">
            <tr><td colspan="5">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- SETTINGS TAB -->
    <div id="admin-tab-settings" style="display: none;">
      <div class="panel" style="max-width: 600px;">
        <div class="panel-title">Update Payment Details</div>
        <p style="color: var(--muted); margin-bottom: 20px; font-size: 0.9rem;">These details will be shown to users when they deposit.</p>
        <label style="font-weight: 600; font-size: 0.9rem;">Bitcoin Deposit Address</label>
        <input type="text" id="set-btc" class="form-input">
        
        <label style="font-weight: 600; font-size: 0.9rem; margin-top: 10px; display: block;">Bank Account Details</label>
        <input type="text" id="set-bank" class="form-input">
        
        <button class="btn-approve" style="margin-top: 15px; width: 100%; padding: 12px;" onclick="saveSettings()">Save Settings</button>
        <div id="set-msg" style="margin-top: 10px; color: var(--emerald); font-weight: bold;"></div>
      </div>
    </div>

  </main>

  <script>
    window.verifyPasscode = () => {
      if (document.getElementById('admin-pass').value === "@@@@") {
        document.getElementById('login-overlay').style.display = 'none';
        loadRequests();
        loadSettings();
      } else { alert("Access Denied"); }
    };

    window.showAdminTab = (tab) => {
      document.getElementById('admin-tab-requests').style.display = tab === 'requests' ? 'block' : 'none';
      document.getElementById('admin-tab-settings').style.display = tab === 'settings' ? 'block' : 'none';
    };

    async function loadRequests() {
      const res = await fetch('/api/admin/requests');
      const txs = await res.json();
      
      document.getElementById('request-table').innerHTML = txs.map(tx => `
        <tr>
          <td><strong>${tx.name}</strong><br>${tx.email}</td>
          <td>${tx.type}</td>
          <td>$${parseFloat(tx.amount).toFixed(2)}</td>
          <td>${tx.details || 'N/A'}</td>
          <td>
            <button class="btn-approve" onclick="processRequest(${tx.id}, 'approve')">Approve</button>
            <button class="btn-reject" onclick="processRequest(${tx.id}, 'reject')">Reject</button>
          </td>
        </tr>
      `).join('') || `<tr><td colspan="5">No pending requests.</td></tr>`;
    }

    window.processRequest = async (txId, action) => {
      if (!confirm(`Are you sure you want to ${action} this request?`)) return;
      const res = await fetch('/api/admin/approve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ txId, action })
      });
      const data = await res.json();
      if (data.success) { loadRequests(); } else { alert(data.error); }
    };

    async function loadSettings() {
      const res = await fetch('/api/admin/settings');
      const data = await res.json();
      document.getElementById('set-btc').value = data.btc_address || '';
      document.getElementById('set-bank').value = data.bank_details || '';
    }

    window.saveSettings = async () => {
      const btc_address = document.getElementById('set-btc').value;
      const bank_details = document.getElementById('set-bank').value;
      const res = await fetch('/api/admin/update-settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ btc_address, bank_details })
      });
      document.getElementById('set-msg').textContent = "Settings saved successfully.";
    };
  </script>
</body>
</html>
