<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Portal | Xanvia Credit Union</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --emerald: #0F8A5F; --deep-green: #0B2E23; --bg: #F4F7F6; --text: #1A1A1A; --muted: #6B7280; --border: #E5E7EB; --danger: #EF4444; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; }
    
    .app-container { width: 100%; max-width: 600px; padding: 20px; padding-bottom: 80px; }
    #dashboard-area { display: none; }
    
    #login-overlay { position: fixed; inset: 0; background: var(--deep-green); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    .login-box { background: white; padding: 40px; border-radius: 20px; text-align: center; width: 90%; max-width: 400px; }
    .login-box h2 { color: var(--deep-green); margin-bottom: 10px; }
    .login-box input { width: 100%; padding: 16px; border: 1px solid #ddd; border-radius: 10px; font-size: 1.5rem; text-align: center; letter-spacing: 8px; margin-bottom: 20px; }
    .login-box button { width: 100%; padding: 16px; background: var(--emerald); color: white; border: none; border-radius: 10px; font-weight: 600; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; }
    .tab { background: white; border: 1px solid var(--border); padding: 10px 20px; border-radius: 20px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .tab.active { background: var(--deep-green); color: white; border-color: var(--deep-green); }
    .view-section { display: none; }
    .view-section.active { display: block; }
    .panel { background: white; border-radius: 16px; padding: 20px; border: 1px solid var(--border); }
    
    .req-item { display: flex; flex-direction: column; padding: 15px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; background: #FAFAFA; }
    .proof-img { width: 100%; max-width: 200px; border-radius: 8px; border: 1px solid #ddd; margin-top: 10px; display: block; }
    .btn-approve { background: var(--emerald); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 600; flex: 1; }
    .btn-reject { background: var(--danger); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 600; flex: 1; }
    .btn-outline { background: white; border: 1px solid var(--border); padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 600; flex: 1;}

    .chat-box { background: #F4F7F6; border-radius: 12px; padding: 15px; margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; }
    .msg.user { background: #E5E7EB; color: var(--text); align-self: flex-start; border-bottom-left-radius: 2px; }
    .msg.admin { background: var(--emerald); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
  </style>
</head>
<body>

  <div id="login-overlay">
    <div class="login-box">
      <h2 style="color:var(--deep-green); margin-bottom:10px;">Admin Access</h2>
      <input type="password" id="admin-pass" maxlength="4" placeholder="••••">
      <button onclick="verifyPasscode()">Unlock</button>
    </div>
  </div>

  <div id="dashboard-area" class="app-container">
    <div class="header">
      <h1>Admin Panel</h1>
      <button onclick="window.location.replace('../index.html')">Exit</button>
    </div>

    <div class="tabs">
      <div class="tab active" id="tab-requests" onclick="switchTab('requests')">Requests</div>
      <div class="tab" id="tab-complaints" onclick="switchTab('complaints')">Support / Complaints</div>
    </div>

    <div id="view-requests" class="view-section active">
      <div class="panel"><h2>Pending Approvals</h2><div id="req-list"></div></div>
    </div>

    <div id="view-complaints" class="view-section">
      <div class="panel"><h2>Support Tickets</h2><div id="complaint-list"></div></div>
    </div>
  </div>

  <script>
    function verifyPasscode() {
      if (document.getElementById('admin-pass').value === "@@@@") {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('dashboard-area').style.display = 'block';
        loadRequests();
      } else { alert("Access Denied"); }
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).classList.add('active');
      document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
      document.getElementById(`view-${tabName}`).classList.add('active');

      if (tabName === 'requests') loadRequests();
      if (tabName === 'complaints') loadComplaints();
    }

    async function loadRequests() {
      const requests = await (await fetch('/api/admin/requests')).json();
      document.getElementById('req-list').innerHTML = requests.length > 0 ? requests.map(tx => `
        <div class="req-item">
          <h4>${tx.name} (${tx.email})</h4>
          <p>Type: ${tx.type.replace(/_/g, ' ')} | Amount: $${parseFloat(tx.amount).toFixed(2)}</p>
          ${tx.proof_image ? `<a href="${tx.proof_image}" target="_blank"><img src="${tx.proof_image}" class="proof-img"></a>` : ''}
          <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button class="btn-approve" onclick="approveReq(${tx.id}, 'approve')">Approve</button>
            <button class="btn-reject" onclick="approveReq(${tx.id}, 'reject')">Reject</button>
          </div>
        </div>
      `).join('') : '<p style="color:var(--muted);">No pending requests.</p>';
    }

    async function loadComplaints() {
      const complaints = await (await fetch('/api/admin/complaints')).json();
      document.getElementById('complaint-list').innerHTML = complaints.length > 0 ? complaints.map(c => `
        <div class="req-item">
          <h4>${c.subject} (${c.ref_number})</h4>
          <p>From: ${c.name} | Category: ${c.category}</p>
          <div class="chat-box">
            <div class="msg user">${c.message}</div>
            ${c.admin_response ? `<div class="msg admin">${c.admin_response}</div>` : ''}
          </div>
          <p style="margin-top:10px;">Status: <strong>${c.status}</strong></p>
          ${c.status !== 'Resolved' ? `
          <div style="margin-top: 10px; display: flex; gap: 10px;">
            <button class="btn-outline" onclick="respondComplaint(${c.id})">Reply & Resolve</button>
          </div>` : ''}
        </div>
      `).join('') : '<p style="color:var(--muted);">No complaints.</p>';
    }

    async function approveReq(id, action) {
      await fetch('/api/admin/approve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ txId: id, action }) });
      loadRequests();
    }

    async function respondComplaint(id) {
      const response = prompt("Enter your reply:");
      if (response === null) return;
      await fetch(`/api/admin/complaints/${id}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: 'Resolved', response }) });
      loadComplaints();
    }
  </script>
</body>
</html>
