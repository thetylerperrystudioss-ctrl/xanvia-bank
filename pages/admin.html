<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Portal | Xanvia Credit Union</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --emerald: #0F8A5F; --deep-green: #0B2E23; --bg: #F4F7F6; --text: #1A1A1A; --muted: #6B7280; --border: #E5E7EB; --danger: #EF4444; --gold: #C9A24B; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 650px; padding: 20px; padding-bottom: 80px; }
    #dashboard-area { display: none; }
    
    #login-overlay { position: fixed; inset: 0; background: var(--deep-green); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    .login-box { background: white; padding: 40px; border-radius: 20px; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
    .login-box h2 { color: var(--deep-green); margin-bottom: 10px; font-family: 'Merriweather', serif; }
    .login-box input { width: 100%; padding: 16px; border: 1px solid #ddd; border-radius: 10px; font-size: 1.5rem; text-align: center; letter-spacing: 8px; margin-bottom: 20px; outline: none; }
    .login-box button { width: 100%; padding: 16px; background: var(--emerald); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .header h1 { font-family: 'Merriweather', serif; color: var(--deep-green); font-size: 1.6rem; font-weight: 900; }
    .btn-exit { background: transparent; border: 1px solid var(--border); padding: 8px 16px; border-radius: 8px; font-weight: 600; color: var(--text); cursor: pointer; font-size: 0.85rem; }

    .mini-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
    .mini-stat-card { background: white; padding: 20px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 10px rgba(0,0,0,0.02); text-align: center; }
    .mini-stat-card p { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; font-weight: 700; margin-bottom: 5px; }
    .mini-stat-card h3 { font-size: 1.6rem; color: var(--deep-green); font-weight: 800; }

    .tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { background: white; border: 1px solid var(--border); padding: 10px 20px; border-radius: 20px; font-weight: 600; cursor: pointer; white-space: nowrap; font-size: 0.9rem; }
    .tab.active { background: var(--deep-green); color: white; border-color: var(--deep-green); }
    
    .view-section { display: none; }
    .view-section.active { display: block; }
    .panel { background: white; border-radius: 16px; padding: 20px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(11,46,35,0.03); }
    .panel h2 { font-size: 1.2rem; color: var(--deep-green); margin-bottom: 15px; }

    .req-item { display: flex; flex-direction: column; padding: 15px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 15px; background: #FAFAFA; }
    .req-item h4 { color: var(--deep-green); font-size: 1rem; margin-bottom: 4px; }
    .req-item p { font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; }
    .proof-img { width: 100px; border-radius: 6px; margin-top: 5px; border: 1px solid #ddd; }

    .user-row { display: flex; flex-direction: column; padding: 15px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 15px; background: #FAFAFA; }
    .user-row h4 { color: var(--deep-green); font-size: 1.1rem; margin-bottom: 4px; }
    .user-row p { font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
    .kyc-images { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .kyc-images a { display: flex; flex-direction: column; align-items: center; gap: 5px; text-decoration: none; }
    .kyc-images img { width: 100px; height: 70px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; }
    .kyc-images span { font-size: 0.7rem; font-weight: 700; color: var(--emerald); }

    .chat-box { background: #F4F7F6; border-radius: 12px; padding: 15px; margin-top: 10px; display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; line-height: 1.4; }
    .msg.user { background: #E5E7EB; color: var(--text); align-self: flex-start; border-bottom-left-radius: 2px; }
    .msg.admin { background: var(--emerald); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg-time { font-size: 0.65rem; opacity: 0.7; margin-top: 4px; display: block; }
    .reply-row { display: flex; gap: 10px; margin-top: 15px; }
    .reply-row input { flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: 8px; outline: none; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; outline: none; }
    .btn-save { width: 100%; padding: 16px; background: var(--emerald); color: white; border: none; border-radius: 10px; font-weight: 700; margin-top: 10px; cursor: pointer; }
    
    /* FILE UPLOAD DESIGN */
    .file-upload { border: 2px dashed var(--border); padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; background: #FAFAFA; position: relative; margin-bottom: 15px; }
    .file-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .file-upload span { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
  </style>
</head>
<body>

  <div id="login-overlay">
    <div class="login-box">
      <h2>Admin Access</h2>
      <input type="password" id="admin-pass" maxlength="4" placeholder="••••">
      <button onclick="verifyPasscode()">Unlock</button>
    </div>
  </div>

  <div id="dashboard-area" class="app-container">
    <div class="header">
      <h1>Admin Terminal</h1>
      <button class="btn-exit" onclick="window.location.replace('../index.html')">Exit</button>
    </div>

    <div class="mini-stats">
      <div class="mini-stat-card">
        <p>Pending Requests</p>
        <h3 id="stat-requests">0</h3>
      </div>
      <div class="mini-stat-card">
        <p>Total Users</p>
        <h3 id="stat-users">0</h3>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" id="tab-users" onclick="switchTab('users')">Users & KYC</div>
      <div class="tab" id="tab-requests" onclick="switchTab('requests')">Approvals</div>
      <div class="tab" id="tab-assets" onclick="switchTab('assets')">Assets</div>
      <div class="tab" id="tab-complaints" onclick="switchTab('complaints')">Support</div>
      <div class="tab" id="tab-notify" onclick="switchTab('notify')">Broadcast</div>
      <div class="tab" id="tab-settings" onclick="switchTab('settings')">Settings</div>
    </div>

    <div id="view-users" class="view-section active">
      <div class="panel">
        <h2>User KYC & Profiles</h2>
        <div id="user-list"><p>Loading...</p></div>
      </div>
    </div>

    <div id="view-requests" class="view-section">
      <div class="panel">
        <h2>Pending Approvals</h2>
        <div id="req-list"><p>Loading...</p></div>
      </div>
    </div>

    <div id="view-assets" class="view-section">
      <div class="panel">
        <h2>Manage Real Estate Assets</h2>
        
        <div class="form-group">
          <label>Category</label>
          <select id="asset-cat">
            <option value="Real Estate">Real Estate</option>
            <option value="Bonds">Bonds</option>
          </select>
        </div>
        
        <!-- PRE-FILLED WITH REAL DATA -->
        <div class="form-group">
          <label>Asset Name</label>
          <input type="text" id="asset-name" value="Luxury 4-Bed Villa in Miami, FL">
        </div>
        
        <div class="form-group">
          <label>Price ($)</label>
          <input type="number" id="asset-price" value="850000">
        </div>
        
        <div class="form-group">
          <label>Image URL (or upload below)</label>
          <input type="text" id="asset-img" value="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?q=80&w=1000&auto=format&fit=crop">
        </div>
        
        <div class="form-group">
          <label>Description</label>
          <textarea id="asset-desc" rows="3">Fully renovated 4-bedroom, 3-bathroom luxury villa in the heart of Miami. Features a private pool, smart home technology, and is located just minutes from the beach. Expected annual ROI: 12%.</textarea>
        </div>
        
        <button class="btn-save" onclick="addAsset()">Publish Real Estate Asset</button>
        <p id="asset-msg" style="text-align:center; margin-top:10px; font-weight:bold; font-size:0.85rem;"></p>

        <h2 style="margin-top:30px; margin-bottom:15px;">Current Marketplace</h2>
        <div id="asset-list-admin"></div>
      </div>
    </div>

    <div id="view-complaints" class="view-section">
      <div class="panel">
        <h2>Support Tickets</h2>
        <div id="complaint-list"><p>Loading...</p></div>
      </div>
    </div>

    <div id="view-notify" class="view-section">
      <div class="panel">
        <h2>Send Notification</h2>
        <div class="form-group">
          <label>Recipient</label>
          <select id="notify-target"><option value="all">All Users</option></select>
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea id="notify-message" rows="4"></textarea>
        </div>
        <button class="btn-save" onclick="sendNotification()">Send</button>
      </div>
    </div>

    <div id="view-settings" class="view-section">
      <div class="panel">
        <h2>System Settings</h2>
        <div class="form-group"><label>Bank Name</label><input type="text" id="set-bank-name"></div>
        <div class="form-group"><label>Account Number</label><input type="text" id="set-bank-account"></div>
        <div class="form-group"><label>Routing Number</label><input type="text" id="set-bank-routing"></div>
        <div class="form-group"><label>Bitcoin Address</label><input type="text" id="set-btc"></div>
        <button class="btn-save" onclick="saveSettings()">Save Settings</button>
      </div>
    </div>
  </div>

  <script>
    function verifyPasscode() {
      if (document.getElementById('admin-pass').value === "@@@@") {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('dashboard-area').style.display = 'block';
        loadUsers(); loadRequests();
      } else { alert("Access Denied"); }
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).classList.add('active');
      document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
      document.getElementById(`view-${tabName}`).classList.add('active');
      
      if (tabName === 'users') loadUsers();
      if (tabName === 'requests') loadRequests();
      if (tabName === 'assets') loadAdminAssets();
      if (tabName === 'complaints') loadComplaints();
      if (tabName === 'notify') loadNotifyDropdown();
      if (tabName === 'settings') loadSettings();
    }

    async function loadUsers() {
      const data = await (await fetch('/api/admin/users')).json();
      document.getElementById('stat-users').textContent = data.length;
      
      document.getElementById('user-list').innerHTML = data.length > 0 ? data.map(u => `
        <div class="user-row">
          <h4>${u.name} (@${u.username})</h4>
          <p>Email: <strong>${u.email}</strong> | Phone: <strong>${u.phone || 'N/A'}</strong></p>
          <p>Address: <strong>${u.address || 'N/A'}</strong></p>
          <p>SSN (Last 4): <strong>***-**-${u.ssn_last4 || 'N/A'}</strong> | Age: <strong>${u.age || 'N/A'}</strong></p>
          <p>Status: <span style="font-weight:700; color:${u.status === 'Active' ? 'var(--emerald)' : 'var(--danger)'};">${u.status}</span></p>
          
          <div class="kyc-images">
            ${u.id_front ? `<a href="${u.id_front}" target="_blank"><img src="${u.id_front}"><span>ID Front</span></a>` : ''}
            ${u.id_back ? `<a href="${u.id_back}" target="_blank"><img src="${u.id_back}"><span>ID Back</span></a>` : ''}
            ${u.proof_of_address ? `<a href="${u.proof_of_address}" target="_blank"><img src="${u.proof_of_address}"><span>Proof of Address</span></a>` : ''}
          </div>

          <div class="user-actions">
            <button class="btn-sm btn-notify" onclick="promptNotify('${u.id}')">Notify</button>
            <button class="btn-sm btn-outline-sm" onclick="freezeUser(${u.id}, '${u.status}')">${u.status === 'Active' ? 'Freeze Account' : 'Unfreeze Account'}</button>
            <button class="btn-sm btn-delete" onclick="deleteUser(${u.id})">Delete</button>
          </div>
        </div>
      `).join('') : '<p>No users found.</p>';
    }

    async function loadRequests() {
      const requests = await (await fetch('/api/admin/requests')).json();
      document.getElementById('stat-requests').textContent = requests.length;
      
      document.getElementById('req-list').innerHTML = requests.length > 0 ? requests.map(tx => `
        <div class="req-item">
          <h4>${tx.name} (${tx.email})</h4>
          <p>Type: <strong>${tx.type.replace(/_/g, ' ')}</strong> | Amount: <strong>$${parseFloat(tx.amount).toFixed(2)}</strong></p>
          ${tx.details && tx.type === 'INVESTMENT_DEPOSIT' ? `<p>Asset: <strong>${tx.details.split('|')[0]} (${tx.details.split('|')[1]})</strong></p>` : ''}
          ${tx.proof_image ? `<a href="${tx.proof_image}" target="_blank"><img src="${tx.proof_image}" class="proof-img"></a>` : ''}
          <div class="action-row">
            <button class="btn-approve" onclick="approveReq(${tx.id}, 'approve')">Approve</button>
            <button class="btn-reject" onclick="approveReq(${tx.id}, 'reject')">Reject</button>
          </div>
        </div>
      `).join('') : '<p>No pending requests.</p>';
    }

    async function approveReq(id, action) {
      await fetch('/api/admin/approve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ txId: id, action }) });
      loadRequests();
    }

    async function loadAdminAssets() {
      const assets = await (await fetch('/api/admin/assets')).json();
      document.getElementById('asset-list-admin').innerHTML = assets.map(a => `
        <div class="req-item">
          <h4>${a.name} <span style="font-size:0.7rem; background:#E0E7FF; padding:2px 6px; border-radius:4px;">${a.category}</span></h4>
          <p>Price: $${parseFloat(a.price).toLocaleString()}</p>
        </div>
      `).join('');
    }

    async function addAsset() {
      const cat = document.getElementById('asset-cat').value;
      const name = document.getElementById('asset-name').value;
      const price = document.getElementById('asset-price').value;
      const img = document.getElementById('asset-img').value;
      const desc = document.getElementById('asset-desc').value;
      if(!name || !price) return alert("Name and Price required");
      
      await fetch('/api/admin/assets/add', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ category: cat, name, price, image_url: img, description: desc }) });
      alert('Real Estate Asset Added!');
      loadAdminAssets();
    }

    async function freezeUser(id, status) {
      const newStatus = status === 'Active' ? 'Frozen' : 'Active';
      await fetch('/api/admin/freeze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: id, status: newStatus }) });
      loadUsers();
    }

    async function deleteUser(id) {
      if(confirm("Delete user?")) {
        await fetch(`/api/admin/users/${id}`, { method: 'DELETE' });
        loadUsers();
      }
    }

    async function promptNotify(id) {
      const msg = prompt("Message:");
      if(msg) {
        await fetch('/api/admin/notify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ target: id, message: msg }) });
        alert("Sent!");
      }
    }

    async function loadComplaints() {
      const c = await (await fetch('/api/admin/complaints')).json();
      document.getElementById('complaint-list').innerHTML = c.length > 0 ? c.map(x => `
        <div class="req-item">
          <h4>${x.subject}</h4>
          <p>From: ${x.name} | Status: ${x.status}</p>
          <div class="chat-box" id="admin-chat-${x.id}"><p>Loading chat...</p></div>
          <div class="reply-row">
            <input type="text" id="admin-reply-${x.id}" placeholder="Type reply...">
            <button class="btn-approve" onclick="sendAdminReply(${x.id})">Send</button>
          </div>
        </div>
      `).join('') : '<p>No complaints.</p>';
      
      c.forEach(comp => loadAdminChat(comp.id));
    }

    async function loadAdminChat(complaintId) {
      const container = document.getElementById(`admin-chat-${complaintId}`);
      if (!container) return;
      const res = await fetch(`/api/chat/${complaintId}`);
      const messages = await res.json();
      container.innerHTML = messages.map(m => `
        <div class="msg ${m.sender}">
          ${m.message}
          <span class="msg-time">${new Date(m.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
        </div>
      `).join('');
      container.scrollTop = container.scrollHeight;
    }

    async function sendAdminReply(complaintId) {
      const input = document.getElementById(`admin-reply-${complaintId}`);
      const message = input.value.trim();
      if (!message) return;
      input.value = "";
      await fetch(`/api/admin/chat/${complaintId}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message }) });
      loadAdminChat(complaintId);
    }

    async function loadNotifyDropdown() {
      const data = await (await fetch('/api/admin/users')).json();
      document.getElementById('notify-target').innerHTML = '<option value="all">All Users</option>' + data.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
    }

    async function sendNotification() {
      const target = document.getElementById('notify-target').value;
      const msg = document.getElementById('notify-message').value;
      if(!msg) return;
      await fetch('/api/admin/notify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ target, message: msg }) });
      alert("Sent!"); document.getElementById('notify-message').value = '';
    }

    async function loadSettings() {
      const data = await (await fetch('/api/admin/settings')).json();
      document.getElementById('set-bank-name').value = data.bank_name || '';
      document.getElementById('set-bank-account').value = data.bank_account || '';
      document.getElementById('set-bank-routing').value = data.bank_routing || '';
      document.getElementById('set-btc').value = data.btc_address || '';
    }

    async function saveSettings() {
      const payload = { 
        bank_name: document.getElementById('set-bank-name').value, 
        bank_account: document.getElementById('set-bank-account').value, 
        bank_routing: document.getElementById('set-bank-routing').value, 
        btc_address: document.getElementById('set-btc').value 
      };
      await fetch('/api/admin/settings/update', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      alert("Settings Saved!");
    }
  </script>
</body>
</html>
