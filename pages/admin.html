<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Portal | Xanvia Credit Union</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --emerald: #0F8A5F; --deep-green: #0B2E23; --bg: #F4F7F6; --text: #1A1A1A; --muted: #6B7280; --border: #E5E7EB; --danger: #EF4444; --gold: #C9A24B; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 650px; padding: 20px; padding-bottom: 80px; }
    #dashboard-area { display: none; }
    
    #login-overlay { position: fixed; inset: 0; background: var(--deep-green); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    .login-box { background: white; padding: 40px; border-radius: 20px; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
    .login-box h2 { color: var(--deep-green); margin-bottom: 10px; }
    .login-box input { width: 100%; padding: 16px; border: 1px solid #ddd; border-radius: 10px; font-size: 1.5rem; text-align: center; letter-spacing: 8px; margin-bottom: 20px; outline: none; }
    .login-box button { width: 100%; padding: 16px; background: var(--emerald); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .header h1 { color: var(--deep-green); font-size: 1.6rem; font-weight: 900; }
    .btn-exit { background: transparent; border: 1px solid var(--border); padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { background: white; border: 1px solid var(--border); padding: 10px 20px; border-radius: 20px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .tab.active { background: var(--deep-green); color: white; border-color: var(--deep-green); }
    
    .view-section { display: none; }
    .view-section.active { display: block; }
    .panel { background: white; border-radius: 16px; padding: 20px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(11,46,35,0.03); }
    .panel h2 { font-size: 1.2rem; color: var(--deep-green); margin-bottom: 15px; }

    .req-item { display: flex; flex-direction: column; padding: 15px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 15px; background: #FAFAFA; }
    .req-item h4 { color: var(--deep-green); font-size: 1rem; margin-bottom: 4px; }
    .req-item p { font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; }
    .proof-img { width: 100%; max-width: 200px; border-radius: 8px; border: 1px solid #ddd; margin-top: 10px; }
    
    .action-row { display: flex; gap: 10px; margin-top: 15px; }
    .btn-approve { background: var(--emerald); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; flex: 1; }
    .btn-reject { background: #FEE2E2; color: #991B1B; border: 1px solid #F87171; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; flex: 1; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; outline: none; }
    .btn-save { width: 100%; padding: 16px; background: var(--emerald); color: white; border: none; border-radius: 10px; font-weight: 700; margin-top: 10px; cursor: pointer; }
  </style>
</head>
<body>

  <div id="login-overlay">
    <div class="login-box">
      <h2>Admin Access</h2>
      <input type="password" id="admin-pass" maxlength="4" placeholder="••••">
      <button onclick="verifyPasscode()">Unlock</button>
    </div>
  </div>

  <div id="dashboard-area" class="app-container">
    <div class="header">
      <h1>Admin Terminal</h1>
      <button class="btn-exit" onclick="window.location.replace('../index.html')">Exit</button>
    </div>

    <div class="tabs">
      <div class="tab active" id="tab-requests" onclick="switchTab('requests')">Approvals</div>
      <div class="tab" id="tab-assets" onclick="switchTab('assets')">Manage Assets</div>
      <div class="tab" id="tab-users" onclick="switchTab('users')">Users</div>
      <div class="tab" id="tab-complaints" onclick="switchTab('complaints')">Support</div>
    </div>

    <div id="view-requests" class="view-section active">
      <div class="panel"><h2>Pending Approvals</h2><div id="req-list">Loading...</div></div>
    </div>

    <div id="view-assets" class="view-section">
      <div class="panel">
        <h2>Add Investment Option</h2>
        <p style="font-size:0.85rem; color:var(--muted); margin-bottom:15px;">Add a new property, bond, or stock to the user marketplace.</p>
        
        <div class="form-group">
          <label>Category</label>
          <select id="asset-cat">
            <option value="Real Estate">Real Estate</option>
            <option value="Bonds">Bonds</option>
            <option value="US Stocks">US Stocks</option>
            <option value="Crypto">Crypto</option>
          </select>
        </div>
        <div class="form-group"><label>Asset Name (e.g., 4 Bedroom Villa, Miami)</label><input type="text" id="asset-name"></div>
        <div class="form-group"><label>Price / Target Amount ($)</label><input type="number" id="asset-price"></div>
        <div class="form-group"><label>Image URL (Optional)</label><input type="text" id="asset-img" placeholder="https://..."></div>
        <div class="form-group"><label>Description</label><textarea id="asset-desc" rows="2"></textarea></div>
        
        <button class="btn-save" onclick="addAsset()">Publish Asset</button>
        <p id="asset-msg" style="text-align:center; margin-top:10px; font-weight:bold; font-size:0.85rem;"></p>

        <h2 style="margin-top:30px; margin-bottom:15px;">Current Marketplace</h2>
        <div id="asset-list-admin"></div>
      </div>
    </div>

    <div id="view-users" class="view-section">
      <div class="panel"><h2>Registered Users</h2><div id="user-list">Loading...</div></div>
    </div>
    
    <div id="view-complaints" class="view-section">
      <div class="panel"><h2>Support Tickets</h2><div id="complaint-list">Loading...</div></div>
    </div>
  </div>

  <script>
    function verifyPasscode() {
      if (document.getElementById('admin-pass').value === "@@@@") {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('dashboard-area').style.display = 'block';
        loadRequests();
      } else { alert("Access Denied"); }
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).classList.add('active');
      document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
      document.getElementById(`view-${tabName}`).classList.add('active');

      if (tabName === 'requests') loadRequests();
      if (tabName === 'assets') loadAdminAssets();
      if (tabName === 'users') loadUsers();
      if (tabName === 'complaints') loadComplaints();
    }

    async function loadRequests() {
      const requests = await (await fetch('/api/admin/requests')).json();
      document.getElementById('req-list').innerHTML = requests.length > 0 ? requests.map(tx => `
        <div class="req-item">
          <h4>${tx.name} (${tx.email})</h4>
          <p>Type: <strong>${tx.type.replace(/_/g, ' ')}</strong> | Amount: <strong>$${parseFloat(tx.amount).toFixed(2)}</strong></p>
          ${tx.details && tx.type === 'INVESTMENT_DEPOSIT' ? `<p>Asset: <strong>${tx.details.split('|')[0]} (${tx.details.split('|')[1]})</strong></p>` : ''}
          ${tx.proof_image ? `<img src="${tx.proof_image}" class="proof-img">` : ''}
          <div class="action-row">
            <button class="btn-approve" onclick="approveReq(${tx.id}, 'approve')">Approve</button>
            <button class="btn-reject" onclick="approveReq(${tx.id}, 'reject')">Reject</button>
          </div>
        </div>
      `).join('') : '<p style="color:var(--muted);">No pending requests.</p>';
    }

    async function approveReq(id, action) {
      await fetch('/api/admin/approve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ txId: id, action }) });
      loadRequests();
    }

    async function loadAdminAssets() {
      const assets = await (await fetch('/api/admin/assets')).json();
      document.getElementById('asset-list-admin').innerHTML = assets.length > 0 ? assets.map(a => `
        <div class="req-item">
          <h4>${a.name} <span style="font-size:0.7rem; background:#E0E7FF; color:#3730A3; padding:2px 6px; border-radius:4px;">${a.category}</span></h4>
          <p>Target: $${parseFloat(a.price).toLocaleString()}</p>
        </div>
      `).join('') : '<p style="color:var(--muted);">No assets added yet.</p>';
    }

    async function addAsset() {
      const category = document.getElementById('asset-cat').value;
      const name = document.getElementById('asset-name').value;
      const price = document.getElementById('asset-price').value;
      const image_url = document.getElementById('asset-img').value;
      const description = document.getElementById('asset-desc').value;
      const msg = document.getElementById('asset-msg');

      if (!name || !price) { msg.textContent = "Name and Price are required."; msg.style.color = "red"; return; }

      msg.textContent = "Publishing..."; msg.style.color = "var(--emerald)";
      const res = await fetch('/api/admin/assets/add', { 
        method: 'POST', headers: { 'Content-Type': 'application/json' }, 
        body: JSON.stringify({ category, name, price, image_url, description }) 
      });
      const data = await res.json();
      
      if (data.success) {
        msg.textContent = "✅ Asset Published!";
        msg.style.color = "var(--emerald)";
        document.getElementById('asset-name').value = '';
        document.getElementById('asset-price').value = '';
        document.getElementById('asset-img').value = '';
        document.getElementById('asset-desc').value = '';
        loadAdminAssets();
      } else {
        msg.textContent = "❌ Failed to publish."; msg.style.color = "red";
      }
      setTimeout(() => msg.textContent = "", 3000);
    }

    async function loadUsers() {
      const data = await (await fetch('/api/admin/users')).json();
      document.getElementById('user-list').innerHTML = data.length > 0 ? data.map(u => `
        <div class="req-item" style="flex-direction: row; justify-content: space-between; align-items: center;">
          <div>
            <h4>${u.name}</h4>
            <p>${u.email}</p>
          </div>
        </div>
      `).join('') : '<p>No users.</p>';
    }

    async function loadComplaints() {
      const complaints = await (await fetch('/api/admin/complaints')).json();
      document.getElementById('complaint-list').innerHTML = complaints.length > 0 ? complaints.map(c => `
        <div class="req-item">
          <h4>${c.subject}</h4>
          <p>From: ${c.name} | Status: <strong>${c.status}</strong></p>
        </div>
      `).join('') : '<p>No complaints.</p>';
    }
  </script>
</body>
</html>
