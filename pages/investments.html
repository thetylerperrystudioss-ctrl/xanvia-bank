<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investments | Xanvia Credit Union</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #F4F7F6; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 600px; background: #F4F7F6; min-height: 100vh; }
    .invest-header { background: linear-gradient(160deg, #11553F 0%, #0A2E23 100%); color: white; padding: 30px 20px 50px; border-radius: 0 0 30px 30px; }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header-top a { color: white; text-decoration: none; font-size: 1.5rem; }
    .invest-summary { text-align: center; }
    .invest-summary p { font-size: 0.85rem; color: rgba(255,255,255,0.7); text-transform: uppercase; margin: 0; }
    .invest-summary h2 { font-size: 3rem; font-weight: 700; margin: 5px 0 15px; }
    
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: -30px 20px 20px; position: relative; z-index: 10; }
    .stat-card { background: white; padding: 20px 15px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); text-align: center; }
    .stat-card p { font-size: 0.75rem; color: var(--muted); font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
    .stat-card h3 { font-size: 1.4rem; color: var(--deep-green); font-weight: 700; }
    .stat-card h3.profit { color: var(--emerald); }
    
    .action-grid { display: flex; gap: 15px; padding: 0 20px 20px; }
    .action-btn { flex: 1; padding: 16px; border-radius: 12px; font-weight: 600; font-size: 1rem; text-align: center; border: none; cursor: pointer; }
    .btn-deposit { background: var(--emerald); color: white; }
    .btn-withdraw { background: white; color: var(--text); border: 1px solid var(--border); }
    
    .history-panel { padding: 0 20px 30px; }
    .tx-item { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal-content { background: white; width: 100%; max-width: 450px; padding: 25px; border-radius: 20px; position: relative; max-height: 90vh; overflow-y: auto; }
    
    .form-group { display: flex; flex-direction: column; margin-bottom: 15px; width: 100%; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #333; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem; outline: none; box-sizing: border-box; }
    
    .close-modal { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 1.5rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="app-container">
    < <header class="invest-header">
      <div class="header-topdiv">
        <a href="hub.html">←</ classa>
        <div class="logo" style="="font-family: var(--font-serif); font-weight: 700;">statXanvia</div>
        <div style="width-card: 24px;"></div>
      </div>
     ">
 <div class="invest-summary">
        <p>         Total Portfolio Balance</p>
        <h2 id=" <total-val">$0.00</h2>
      </pdiv>
    </header>

    <main>
      <>div class="stats-grid">
       Deposited Capital</p>
          <h3 id="capital-val">$0.00</h3>
        </div>
        <div class="stat-card">
          <p>Accumulated Profit</p>
          <h3 class="profit" id="profit-val">+$0.00</h3>
        </div>
      </div>

      <div class="action-grid">
        <button class="action-btn btn-deposit" onclick="openModal('deposit')">Deposit</button>
        <button class="action-btn btn-withdraw" onclick="openModal('withdraw')">Withdraw</button>
      </div>

      <div class="history-panel">
        <h3 style="color: var(--deep-green); margin-bottom: 15px;">Investment History</h3>
        <div id="history-list"></div>
      </div>
    </main>
  </div>

  <!-- DEPOSIT MODAL -->
  <div id="modal-deposit" class="modal-overlay">
    <div class="modal-content">
      <button class="close-modal" onclick="closeModal()">×</button>
      <h2 style="color:var(--deep-green); margin-bottom:15px; font-size:1.3rem;">Invest Funds</h2>
      
      <div style="background: #F4F7F6; padding: 15px; border-radius: 8px; margin-bottom: 15px; font-size: 0.85rem; line-height: 1.5;">
        <p style="margin: 0 0 5px; font-weight: 600;">Send payment to:</p>
        <div>Bank: <span id="adm-bank">Loading...</span></div>
        <div>Acct: <span id="adm-acc">Loading...</span></div>
        <div>Routing: <span id="adm-rout">Loading...</span></div>
        <hr style="border:none; border-top:1px solid #ddd; margin:10px 0;">
        <div>₿ <strong>Bitcoin:</strong> <span id="adm-btc" style="word-break:break-all;">Loading...</span></div>
      </div>

      <div class="form-group"><label>Amount ($)</label><input type="number" id="dep-amount" placeholder="0.00"></div>
      <div class="form-group"><label>Payment Reference</label><input type="text" id="dep-ref" placeholder="e.g. BTC TXID"></div>
      <div class="form-group"><label>Upload Receipt</label><input type="file" id="dep-screenshot" accept="image/*" style="padding: 8px;"></div>
      
      <button onclick="submitDeposit()" style="width:100%; padding:14px; background:var(--emerald); color:white; border:none; border-radius:8px; font-weight:600; cursor:pointer;">Submit</button>
      <div id="dep-msg" style="margin-top:10px; text-align:center; font-weight:bold;"></div>
    </div>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem("xanvia_user"));
    if(!user) window.location.replace("../index.html");
    const formatUSD = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(val);

    let liveCapital = 0;
    let liveProfit = 0;
    let profitTickRate = 0; // How much profit to add every second

    async function loadData() {
      const setRes = await fetch('/api/admin/settings');
      const settings = await setRes.json();
      document.getElementById('adm-bank').textContent = settings.bank_name || 'N/A';
      document.getElementById('adm-acc').textContent = settings.bank_account || 'N/A';
      document.getElementById('adm-rout').textContent = settings.bank_routing || 'N/A';
      document.getElementById('adm-btc').textContent = settings.btc_address || 'N/A';

      const res = await fetch(`/api/investments/${user.id}`);
      const data = await res.json();

      liveCapital = 0;
      let baseProfit = 0;
      profitTickRate = 0;

      data.forEach(inv => {
        if (inv.status === 'Active') {
          liveCapital += parseFloat(inv.amount);
          baseProfit += parseFloat(inv.profit);

          // Calculate how much profit is earned PER SECOND for this specific investment
          if (inv.start_date && inv.maturity_date) {
            const totalDurationSeconds = (new Date(inv.maturity_date) - new Date(inv.start_date)) / 1000;
            const totalExpectedProfit = parseFloat(inv.amount) * 1.4; // 140% total return
            const profitPerSecond = totalExpectedProfit / totalDurationSeconds;
            
            // Add to the tick rate if it hasn't matured yet
            if (new Date() < new Date(inv.maturity_date)) {
              profitTickRate += profitPerSecond;
            }
          }
        }
      });

      liveProfit = baseProfit;

      // Set initial values
      updateUI();

      // Load history
      const txRes = await fetch(`/api/transactions/${user.id}`);
      const txs = await txRes.json();
      const investTxs = txs.filter(tx => tx.type.includes('INVESTMENT'));

      document.getElementById('history-list').innerHTML = investTxs.length > 0 ? investTxs.map(tx => `
        <div class="tx-item">
          <div>
            <h4 style="margin:0 0 4px; font-size:0.9rem;">${tx.type.replace('_', ' ')}</h4>
            <p style="margin:0; font-size:0.75rem; color:var(--muted);">${new Date(tx.created_at).toLocaleDateString()}</p>
          </div>
          <div style="text-align:right;">
            <strong style="color:${tx.status === 'Approved' ? 'var(--emerald)' : 'var(--warning)'}">${formatUSD(tx.amount)}</strong>
            <div style="font-size:0.7rem; color:var(--muted);">${tx.status}</div>
          </div>
        </div>
      `).join('') : '<p style="color: var(--muted); font-size: 0.9rem;">No investment history.</p>';
    }

    function updateUI() {
      document.getElementById('capital-val').textContent = formatUSD(liveCapital);
      document.getElementById('profit-val').textContent = `+${formatUSD(liveProfit)}`;
      document.getElementById('total-val').textContent = formatUSD(liveCapital + liveProfit);
    }

    // The live ticker: Adds profit every 1 second
    setInterval(() => {
      if (profitTickRate > 0) {
        liveProfit += profitTickRate;
        updateUI();
      }
    }, 1000);

    function openModal(type) { document.getElementById(`modal-${type}`).classList.add('open'); }
    function closeModal() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('open')); }

    async function submitDeposit() {
      const amount = parseFloat(document.getElementById('dep-amount').value);
      const ref = document.getElementById('dep-ref').value;
      const file = document.getElementById('dep-screenshot').files[0];
      const msg = document.getElementById('dep-msg');

      if (!amount || !file) { msg.textContent = "Enter amount and upload receipt."; msg.style.color = "red"; return; }

      const formData = new FormData();
      formData.append('userId', user.id);
      formData.append('amount', amount);
      formData.append('reference', ref);
      formData.append('screenshot', file);

      const res = await fetch('/api/investments/deposit', { method: 'POST', body: formData });
      const data = await res.json();
      msg.textContent = data.message || data.error;
      msg.style.color = data.success ? "var(--emerald)" : "red";
      if(data.success) setTimeout(() => { closeModal(); loadData(); }, 1500);
    }

    loadData();
  </script>
</body>
</html>
