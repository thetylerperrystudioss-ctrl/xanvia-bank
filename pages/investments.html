<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investments | Xanvia Credit Union</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/dashboard.css">
  
  <style>
    /* Reset and Force Mobile App Layout */
    body { 
      background-color: #F4F7F6; 
      margin: 0; 
      display: flex; 
      justify-content: center; 
      min-height: 100vh;
    }
    
    .app-container { 
      width: 100%; 
      max-width: 600px; 
      background: #F4F7F6; 
      min-height: 100vh; 
      position: relative; 
      overflow-x: hidden;
    }

    /* Header */
    .invest-header { 
      background: linear-gradient(160deg, #11553F 0%, #0A2E23 100%); 
      color: white; 
      padding: 30px 20px 50px; 
      border-radius: 0 0 30px 30px; 
      position: relative; 
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header-top a { color: white; text-decoration: none; font-size: 1.5rem; }
    .logo { font-family: var(--font-serif); font-weight: 700; font-size: 1.2rem; }
    
    .invest-summary { text-align: center; }
    .invest-summary p { font-size: 0.85rem; color: rgba(255,255,255,0.7); text-transform: uppercase; letter-spacing: 1px; margin: 0; }
    .invest-summary h2 { font-size: 3rem; font-weight: 700; margin: 5px 0 15px; letter-spacing: -1px; }

    /* Stats Grid */
    .stats-grid { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 15px; 
      margin: -30px 20px 20px; 
      position: relative; 
      z-index: 10; 
    }
    .stat-card { 
      background: white; 
      padding: 20px 15px; 
      border-radius: 16px; 
      box-shadow: 0 8px 20px rgba(0,0,0,0.05); 
      text-align: center; 
    }
    .stat-card p { font-size: 0.75rem; color: var(--muted); font-weight: 600; text-transform: uppercase; margin: 0 0 8px; }
    .stat-card h3 { font-size: 1.4rem; color: var(--deep-green); font-weight: 700; margin: 0; }
    .stat-card h3.profit { color: var(--emerald); }

    /* Actions */
    .action-grid { display: flex; gap: 15px; padding: 0 20px 20px; }
    .action-btn { 
      flex: 1; 
      padding: 16px; 
      border-radius: 12px; 
      font-weight: 600; 
      font-size: 1rem; 
      text-align: center; 
      border: none; 
      cursor: pointer; 
    }
    .btn-deposit { background: var(--emerald); color: white; }
    .btn-withdraw { background: white; color: var(--text); border: 1px solid var(--border); }

    /* History */
    .history-panel { padding: 0 20px 30px; }
    .history-panel h3 { font-size: 1.1rem; color: var(--deep-green); margin-bottom: 15px; }
    .tx-item { 
      background: white; 
      padding: 15px; 
      border-radius: 12px; 
      margin-bottom: 10px; 
      border: 1px solid var(--border); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    .tx-info h4 { font-size: 0.95rem; margin-bottom: 4px; color: var(--text); }
    .tx-info p { font-size: 0.75rem; color: var(--muted); margin: 0; }
    .tx-amount { font-weight: 700; text-align: right; }

    /* Modals */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal-content { background: var(--white); width: 100%; max-width: 450px; padding: 30px; border-radius: 20px; position: relative; max-height: 90vh; overflow-y: auto; }
    .modal-content h2 { color: var(--deep-green); margin-bottom: 15px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; outline: none; box-sizing: border-box; }
    .close-modal { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--muted); }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="invest-header">
      <div class="header-top">
        <a href="hub.html">←</a>
        <div class="logo">Xanvia</div>
        <div style="width: 24px;"></div>
      </div>
      <div class="invest-summary">
        <p>Total Portfolio Balance</p>
        <h2 id="total-val">$0.00</h2>
      </div>
    </header>

    <main>
      <div class="stats-grid">
        <div class="stat-card">
          <p>Deposited Capital</p>
          <h3 id="capital-val">$0.00</h3>
        </div>
        <div class="stat-card">
          <p>Accumulated Profit</p>
          <h3 class="profit" id="profit-val">+$0.00</h3>
        </div>
      </div>

      <div class="action-grid">
        <button class="action-btn btn-deposit" onclick="openModal('deposit')">Deposit</button>
        <button class="action-btn btn-withdraw" onclick="openModal('withdraw')">Withdraw</button>
      </div>

      <div class="history-panel">
        <h3>Investment History</h3>
        <div id="history-list">
          <p style="color: var(--muted); font-size: 0.9rem;">Loading...</p>
        </div>
      </div>
    </main>
  </div>

  <!-- DEPOSIT MODAL -->
  <div id="modal-deposit" class="modal-overlay">
    <div class="modal-content">
      <button class="close-modal" onclick="closeModal()">×</button>
      <h2>Invest Funds</h2>
      
      <div style="background: #F4F7F6; padding: 15px; border-radius: 8px; margin-bottom: 15px; font-size: 0.85rem;">
        <p style="margin: 0 0 5px; font-weight: 600;">Send payment to:</p>
        <div>Bank: <span id="adm-bank">Loading...</span></div>
        <div>Acct: <span id="adm-acc">Loading...</span></div>
        <div>Routing: <span id="adm-rout">Loading...</span></div>
      </div>

      <div class="form-group"><label>Amount ($)</label><input type="number" id="dep-amount" placeholder="0.00"></div>
      <div class="form-group"><label>Payment Reference</label><input type="text" id="dep-ref" placeholder="e.g. BTC TXID"></div>
      <div class="form-group"><label>Upload Receipt</label><input type="file" id="dep-screenshot" accept="image/*"></div>
      
      <button onclick="submitDeposit()" style="width:100%; padding:14px; background:var(--emerald); color:white; border:none; border-radius:8px; font-weight:600; margin-top:10px; cursor:pointer;">Submit</button>
      <button onclick="closeModal()" style="width:100%; padding:14px; background:transparent; border:none; font-weight:600; margin-top:5px; cursor:pointer;">Cancel</button>
      <div id="dep-msg" style="margin-top:10px; text-align:center; font-weight:bold;"></div>
    </div>
  </div>

  <!-- WITHDRAW MODAL -->
  <div id="modal-withdraw" class="modal-overlay">
    <div class="modal-content">
      <button class="close-modal" onclick="closeModal()">×</button>
      <h2>Withdraw Funds</h2>
      <div class="form-group"><label>Amount ($)</label><input type="number" id="wd-amount" placeholder="0.00"></div>
      <div class="form-group"><label>Bank Details</label><input type="text" id="wd-bank" placeholder="Bank Name, Acct Number"></div>
      <button onclick="submitWithdraw()" style="width:100%; padding:14px; background:var(--emerald); color:white; border:none; border-radius:8px; font-weight:600; margin-top:10px; cursor:pointer;">Request Withdrawal</button>
      <button onclick="closeModal()" style="width:100%; padding:14px; background:transparent; border:none; font-weight:600; margin-top:5px; cursor:pointer;">Cancel</button>
      <div id="wd-msg" style="margin-top:10px; text-align:center; font-weight:bold;"></div>
    </div>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem("xanvia_user"));
    if(!user) window.location.replace("../index.html");
    
    const formatUSD = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(val);

    async function loadData() {
      try {
        // Fetch Admin Details for modal
        const setRes = await fetch('/api/admin/settings');
        const settings = await setRes.json();
        document.getElementById('adm-bank').textContent = settings.bank_name || 'Chase Bank';
        document.getElementById('adm-acc').textContent = settings.bank_account || '123456789';
        document.getElementById('adm-rout').textContent = settings.bank_routing || '021000021';

        // Fetch Investments
        const res = await fetch(`/api/investments/${user.id}`);
        const data = await res.json();

        let totalCapital = 0;
        let totalProfit = 0;

        data.forEach(inv => {
          if (inv.status === 'Active') {
            totalCapital += parseFloat(inv.amount);
            totalProfit += parseFloat(inv.profit);
          }
        });

        document.getElementById('capital-val').textContent = formatUSD(totalCapital);
        document.getElementById('profit-val').textContent = `+${formatUSD(totalProfit)}`;
        document.getElementById('total-val').textContent = formatUSD(totalCapital + totalProfit);

        // Render History
        const historyList = document.getElementById('history-list');
        if (data.length === 0) {
          historyList.innerHTML = `<p style="color: var(--muted); font-size: 0.9rem; text-align:center; padding:20px;">No investment history yet.</p>`;
        } else {
          historyList.innerHTML = data.map(inv => `
            <div class="tx-item">
              <div class="tx-info">
                <h4>Investment</h4>
                <p>Status: <span style="color:${inv.status === 'Active' ? 'var(--emerald)' : 'var(--warning)'}">${inv.status}</span></p>
              </div>
              <div class="tx-amount">
                ${formatUSD(inv.amount)}
                <div style="font-size:0.7rem; color:var(--emerald);">+${formatUSD(inv.profit)}</div>
              </div>
            </div>
          `).join('');
        }
      } catch (err) {
        console.error("Error loading investments:", err);
      }
    }

    function openModal(type) { 
      document.getElementById(`modal-${type}`).classList.add('open'); 
    }
    
    function closeModal() { 
      document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('open')); 
    }

    async function submitDeposit() {
      const amount = parseFloat(document.getElementById('dep-amount').value);
      const ref = document.getElementById('dep-ref').value;
      const file = document.getElementById('dep-screenshot').files[0];
      const msg = document.getElementById('dep-msg');

      if (!amount || !file) { 
        msg.textContent = "Please enter an amount and upload a receipt."; 
        msg.style.color = "red"; 
        return; 
      }

      const formData = new FormData();
      formData.append('userId', user.id);
      formData.append('amount', amount);
      formData.append('reference', ref);
      formData.append('screenshot', file);

      msg.textContent = "Processing...";
      msg.style.color = "var(--emerald)";

      try {
        const res = await fetch('/api/investments/deposit', { method: 'POST', body: formData });
        const data = await res.json();
        
        msg.textContent = data.message || data.error; 
        msg.style.color = data.success ? "var(--emerald)" : "red";
        
        if(data.success) setTimeout(() => { closeModal(); loadData(); }, 1500);
      } catch (err) {
        msg.textContent = "Upload failed."; 
        msg.style.color = "red";
      }
    }

    async function submitWithdraw() {
      const amount = parseFloat(document.getElementById('wd-amount').value);
      const bank = document.getElementById('wd-bank').value;
      const msg = document.getElementById('wd-msg');

      if (!amount || !bank) { 
        msg.textContent = "Please fill all fields."; 
        msg.style.color = "red"; 
        return; 
      }

      msg.textContent = "Processing...";
      msg.style.color = "var(--emerald)";

      try {
        const res = await fetch('/api/investments/withdraw', { 
          method: 'POST', 
          headers: { 'Content-Type': 'application/json' }, 
          body: JSON.stringify({ userId: user.id, amount, bankDetails: bank }) 
        });
        const data = await res.json();
        
        msg.textContent = data.message || data.error; 
        msg.style.color = data.success ? "var(--emerald)" : "red";
        
        if(data.success) setTimeout(() => { closeModal(); loadData(); }, 1500);
      } catch (err) {
        msg.textContent = "Request failed."; 
        msg.style.color = "red";
      }
    }

    loadData();
  </script>
</body>
</html>
