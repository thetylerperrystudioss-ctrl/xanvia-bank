<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Investment Terminal | Xanvia</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --emerald: #0F8A5F; --deep-green: #0B2E23; --bg: #F4F7F6; --surface: #FFFFFF; --text: #1A1A1A; --border: #E5E7EB; --muted: #6B7280; --gold: #C9A24B; --danger: #EF4444; --font-main: 'Inter', sans-serif; --font-mono: 'JetBrains Mono', monospace; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); }
    body { background: var(--bg); display: flex; justify-content: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 650px; background: var(--bg); min-height: 100vh; position: relative; overflow-x: hidden; padding-bottom: 40px; }

    .ticker-wrap { width: 100%; overflow: hidden; background: #061a13; padding: 10px 0; white-space: nowrap; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .ticker { display: inline-block; animation: ticker 35s linear infinite; }
    .ticker-item { display: inline-flex; align-items: center; gap: 8px; color: white; font-size: 0.8rem; font-weight: 600; margin-right: 30px; font-family: var(--font-mono); }
    .ticker-item span.up { color: #34D399; }
    .ticker-item span.down { color: #F87171; }
    @keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-50%, 0, 0); } }

    .invest-header { background: linear-gradient(160deg, #11553F 0%, #0A2E23 100%); color: white; padding: 30px 20px 50px; border-radius: 0 0 30px 30px; text-align: center; }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .header-top a { color: white; text-decoration: none; font-size: 1.5rem; }
    .invest-summary p { font-size: 0.85rem; color: rgba(255,255,255,0.7); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
    .invest-summary h2 { font-size: 3rem; font-weight: 800; margin: 0; letter-spacing: -1px; font-family: var(--font-mono); }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: -30px 20px 20px; position: relative; z-index: 10; }
    .stat-card { background: var(--surface); padding: 20px 15px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); text-align: center; border: 1px solid var(--border); }
    .stat-card p { font-size: 0.75rem; color: var(--muted); font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
    .stat-card h3 { font-size: 1.4rem; color: var(--deep-green); font-weight: 800; font-family: var(--font-mono); margin: 0; }
    .stat-card h3.profit { color: var(--emerald); }

    .action-grid { display: flex; gap: 15px; padding: 0 20px 20px; }
    .action-btn { flex: 1; padding: 16px; border-radius: 12px; font-weight: 700; font-size: 1rem; text-align: center; border: none; cursor: pointer; transition: 0.2s; }
    .btn-deposit { background: var(--emerald); color: white; box-shadow: 0 4px 10px rgba(15,138,95,0.3); }

    .marketplace { padding: 0 20px 20px; }
    .marketplace h3 { color: var(--deep-green); margin-bottom: 15px; font-size: 1.1rem; }
    
    .tab-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
    .tab-container::-webkit-scrollbar { display: none; }
    .tab-btn { background: var(--surface); border: 1px solid var(--border); padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; color: var(--muted); white-space: nowrap; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: var(--deep-green); color: white; border-color: var(--deep-green); }

    .asset-list { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
    
    .asset-card-img { background: var(--surface); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; cursor: pointer; }
    .asset-img { width: 100%; height: 140px; object-fit: cover; background: #eee; }
    .asset-info-box { padding: 15px; display: flex; justify-content: space-between; align-items: center; }
    .asset-name { font-weight: 700; font-size: 1rem; color: var(--text); margin-bottom: 4px; }
    .asset-cat { font-size: 0.75rem; color: var(--muted); }
    .asset-price-box { text-align: right; }
    .asset-price-box h4 { font-family: var(--font-mono); font-size: 1.1rem; margin: 0; color: var(--emerald); }
    
    .asset-card { background: var(--surface); padding: 15px; border-radius: 14px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .asset-icon { width: 40px; height: 40px; background: #F4F7F6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--deep-green); }
    .asset-price span { font-size: 0.8rem; font-weight: 600; }
    .asset-price span.up { color: var(--emerald); }
    .asset-price span.down { color: var(--danger); }

    .history-panel { padding: 0 20px 30px; }
    .history-panel h3 { color: var(--deep-green); margin-bottom: 15px; font-size: 1.1rem; }
    .tx-item { background: var(--surface); padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .tx-info h4 { font-size: 0.95rem; margin: 0 0 4px 0; color: var(--text); }
    .tx-info p { font-size: 0.75rem; color: var(--muted); margin: 0; }
    .tx-amount { font-weight: 800; text-align: right; font-family: var(--font-mono); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
    .modal-overlay.open { display: flex; }
    .modal-content { background: white; width: 100%; max-width: 450px; padding: 25px; border-radius: 20px; position: relative; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
    .form-group { display: flex; flex-direction: column; margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; outline: none; background: #FAFAFA; }
    .form-group input:focus { border-color: var(--emerald); background: white; }
    
    .admin-details-box { background: #F4F7F6; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid var(--border); font-size: 0.85rem; line-height: 1.6; }
    .admin-details-box strong { color: var(--deep-green); }
    .copy-btn { background: var(--emerald); color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; cursor: pointer; margin-left: 5px; }
    .btc-address { font-family: monospace; font-size: 0.8rem; word-break: break-all; background: white; padding: 8px; border-radius: 6px; border: 1px solid #ddd; margin-top: 5px; display: flex; justify-content: space-between; align-items: center; }

    .quick-amounts { display: flex; gap: 10px; margin-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
    .quick-amounts::-webkit-scrollbar { display: none; }
    .quick-btn { background: #F4F7F6; border: 1px solid var(--border); padding: 8px 16px; border-radius: 20px; font-size: 0.9rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .close-modal { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--muted); }
  </style>
</head>
<body>
  <div class="app-container">
    
    <div class="ticker-wrap">
      <div class="ticker" id="ticker-track"></div>
    </div>

    <header class="invest-header">
      <div class="header-top">
        <a href="hub.html">←</a>
        <div style="font-weight: 800; font-size: 1.2rem;">Xanvia Terminal</div>
        <div style="width: 24px;"></div>
      </div>
      <div class="invest-summary">
        <p>Total Portfolio Balance</p>
        <h2 id="total-val">$0.00</h2>
      </div>
    </header>

    <main>
      <div class="stats-grid">
        <div class="stat-card">
          <p>Invested Capital</p>
          <h3 id="capital-val">$0.00</h3>
        </div>
        <div class="stat-card">
          <p>Accumulated Profit</p>
          <h3 class="profit" id="profit-val">+$0.00</h3>
        </div>
      </div>

      <div class="action-grid">
        <button class="action-btn btn-deposit" onclick="openDepositModal('General Portfolio', 'Crypto')">Fund Account</button>
        <button class="action-btn" style="background:white; border:1px solid var(--border); color:var(--text);" onclick="checkWithdrawal()">Withdraw</button>
      </div>

      <div class="marketplace">
        <h3>Markets & Opportunities</h3>
        <div class="tab-container">
          <button class="tab-btn active" onclick="switchTab('crypto', this)">Crypto</button>
          <button class="tab-btn" onclick="switchTab('stocks', this)">US Stocks</button>
          <button class="tab-btn" onclick="switchTab('Real Estate', this)">Real Estate</button>
          <button class="tab-btn" onclick="switchTab('Bonds', this)">Bonds</button>
        </div>

        <div id="asset-list-container" class="asset-list"></div>
      </div>

      <div class="history-panel" style="margin-top: 20px;">
        <h3>Investment History</h3>
        <div id="history-list">
          <p style="text-align:center; color:var(--muted); font-size:0.9rem;">Loading history...</p>
        </div>
      </div>
    </main>
  </div>

  <!-- DEPOSIT MODAL -->
  <div id="modal-deposit" class="modal-overlay">
    <div class="modal-content">
      <button class="close-modal" onclick="closeModal()">×</button>
      <h2 style="color:var(--deep-green); margin-bottom:15px; font-size:1.3rem;">Fund Investment</h2>
      
      <div class="admin-details-box">
        <p style="margin: 0 0 5px; font-weight: 700; color:var(--deep-green);">Send payment to:</p>
        <div><strong>Bank:</strong> <span id="adm-bank">Loading...</span></div>
        <div><strong>Acct:</strong> <span id="adm-acc">Loading...</span></div>
        <div><strong>Routing:</strong> <span id="adm-rout">Loading...</span></div>
        
        <div style="margin-top: 10px; border-top: 1px dashed #ccc; padding-top: 10px;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:700; color:var(--deep-green);">₿ Bitcoin (Fast Payment)</span>
          </div>
          <div class="btc-address">
            <span id="adm-btc">Loading...</span>
            <button class="copy-btn" onclick="copyBtc()">Copy</button>
          </div>
        </div>
      </div>
      
      <div class="form-group">
        <label>Selected Asset</label>
        <input type="text" id="dep-asset-name" readonly style="background:#E6F4EE; color:var(--emerald); font-weight:700;">
      </div>

      <div class="form-group">
        <label>Select Investment Term</label>
        <select id="dep-term" style="width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; outline: none; background: #FAFAFA;">
          <option value="7">7 Days (Standard)</option>
          <option value="14">14 Days (Extended)</option>
          <option value="30">30 Days (Premium)</option>
          <option value="60">60 Days (VIP)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Amount ($)</label>
        <div class="quick-amounts">
          <button class="quick-btn" onclick="setVal('dep-amount', 100)">$100</button>
          <button class="quick-btn" onclick="setVal('dep-amount', 500)">$500</button>
          <button class="quick-btn" onclick="setVal('dep-amount', 1000)">$1,000</button>
        </div>
        <input type="number" id="dep-amount" placeholder="0.00">
      </div>
      
      <div class="form-group"><label>Transaction Reference / TXID</label><input type="text" id="dep-ref" placeholder="e.g. Bitcoin Hash"></div>
      <div class="form-group"><label>Upload Receipt</label><input type="file" id="dep-screenshot" accept="image/*"></div>
      
      <button onclick="submitDeposit()" style="width:100%; padding:16px; background:var(--emerald); color:white; border:none; border-radius:10px; font-weight:700; cursor:pointer;">Submit Deposit</button>
      <div id="dep-msg" style="margin-top:10px; text-align:center; font-weight:bold;"></div>
    </div>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem("xanvia_user"));
    if(!user) window.location.replace("../index.html");
    const formatUSD = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(val);

    let liveCapital = 0;
    let liveProfit = 0;
    let profitTickRate = 0;
    let marketData = { crypto: [], stocks: [] };
    let customAssets = [];

    function setVal(id, val) { document.getElementById(id).value = val; }

    function copyBtc() {
      const btc = document.getElementById('adm-btc').textContent;
      navigator.clipboard.writeText(btc);
      alert('Bitcoin address copied to clipboard!');
    }

    async function fetchMarketData() {
      try {
        const res = await fetch('/api/market');
        marketData = await res.json();
        
        const track = document.getElementById('ticker-track');
        if(marketData.crypto && marketData.crypto.length > 0) {
          const tickerHtml = marketData.crypto.map(coin => `
            <div class="ticker-item">${coin.ticker} <span class="${coin.change >= 0 ? 'up' : 'down'}">$${coin.price.toLocaleString()} (${coin.change > 0 ? '+' : ''}${coin.change.toFixed(2)}%)</span></div>
          `).join('');
          track.innerHTML = tickerHtml + tickerHtml;
        }
      } catch (err) { console.log("Market fail", err); }
    }

    async function fetchCustomAssets() {
      try {
        const res = await fetch('/api/assets');
        customAssets = await res.json();
      } catch (err) { console.log("Assets fail", err); }
    }

    function switchTab(category, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const container = document.getElementById('asset-list-container');

      if (category === 'crypto' || category === 'stocks') {
        const assets = marketData[category] || [];
        if (assets.length === 0) { container.innerHTML = '<p style="text-align:center; padding:20px; color:var(--muted);">No market data available. Please refresh.</p>'; return; }

        container.innerHTML = assets.map(asset => `
          <div class="asset-card" onclick="openDepositModal('${asset.name}', '${category}')">
            <div style="display:flex; align-items:center; gap:12px;">
              <div class="asset-icon">${asset.icon}</div>
              <div>
                <div style="font-weight:700; font-size:1rem;">${asset.name}</div>
                <div style="font-size:0.75rem; color:var(--muted);">${asset.ticker}</div>
              </div>
            </div>
            <div style="text-align:right;">
              <h4 style="font-family:var(--font-mono);">$${parseFloat(asset.price).toLocaleString()}</h4>
              <span class="${asset.change >= 0 ? 'up' : 'down'}" style="font-size:0.8rem; font-weight:600;">${asset.change > 0 ? '+' : ''}${parseFloat(asset.change).toFixed(2)}%</span>
            </div>
          </div>
        `).join('');
      } else {
        const assets = customAssets.filter(a => a.category === category);
        if (assets.length === 0) { container.innerHTML = `<p style="text-align:center; padding:20px; color:var(--muted);">No ${category} available right now.</p>`; return; }

        container.innerHTML = assets.map(asset => `
          <div class="asset-card-img" onclick="openDepositModal('${asset.name}', '${asset.category}')">
            <img src="${asset.image_url || 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?q=80&w=1000&auto=format&fit=crop'}" class="asset-img">
            <div class="asset-info-box">
              <div>
                <div class="asset-name">${asset.name}</div>
                <div class="asset-cat">${asset.category}</div>
              </div>
              <div class="asset-price-box">
                <h4>${formatUSD(asset.price)}</h4>
              </div>
            </div>
          </div>
        `).join('');
      }
    }

    function openDepositModal(name, category) {
      document.getElementById('dep-asset-name').value = `${name} (${category})`;
      document.getElementById('modal-deposit').classList.add('open');
    }

    async function checkWithdrawal() {
      try {
        const res = await fetch(`/api/investments/${user.id}`);
        const data = await res.json();
        const active = data.filter(inv => inv.status === 'Active');

        if (active.length === 0) {
          alert("You do not have any active investments to withdraw from.");
          return;
        }

        const nextMaturity = active.reduce((earliest, inv) => {
          const invDate = new Date(inv.maturity_date);
          return invDate < earliest ? invDate : earliest;
        }, new Date(active[0].maturity_date));

        const now = new Date();
        const diffTime = nextMaturity - now;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        if (diffDays > 0) {
          alert(`Withdrawal Available In:\n\nYour funds will be fully available for withdrawal in ${diffDays} days (${nextMaturity.toLocaleDateString()}).`);
        } else {
          alert("Your investments have matured! Please submit a withdrawal request via support.");
        }
      } catch (err) {
        alert("Withdrawal requests are processed manually. Contact support.");
      }
    }

    async function loadAdminDetailsAndHistory() {
      try {
        const setRes = await fetch('/api/admin/settings');
        if(!setRes.ok) throw new Error("Failed to fetch settings");
        const settings = await setRes.json();
        document.getElementById('adm-bank').textContent = settings.bank_name || 'Chase Bank';
        document.getElementById('adm-acc').textContent = settings.bank_account || '123456789';
        document.getElementById('adm-rout').textContent = settings.bank_routing || '021000021';
        document.getElementById('adm-btc').textContent = settings.btc_address || 'bc1q...xanvia';
      } catch (err) {
        document.getElementById('adm-bank').textContent = 'Unavailable';
        document.getElementById('adm-acc').textContent = 'Unavailable';
        document.getElementById('adm-rout').textContent = 'Unavailable';
        document.getElementById('adm-btc').textContent = 'Unavailable';
      }

      try {
        const res = await fetch(`/api/investments/${user.id}`);
        const data = await res.json();

        liveCapital = 0;
        let baseProfit = 0;
        profitTickRate = 0;

        data.forEach(inv => {
          if (inv.status === 'Active') {
            liveCapital += parseFloat(inv.amount);
            baseProfit += parseFloat(inv.profit);

            if (inv.start_date && inv.maturity_date) {
              const totalDurationSeconds = (new Date(inv.maturity_date) - new Date(inv.start_date)) / 1000;
              const totalExpectedProfit = parseFloat(inv.amount) * 0.4;
              const profitPerSecond = totalExpectedProfit / totalDurationSeconds;
              if (new Date() < new Date(inv.maturity_date)) {
                profitTickRate += profitPerSecond;
              }
            }
          }
        });

        liveProfit = baseProfit;
        updateUI();

        const txRes = await fetch(`/api/transactions/${user.id}`);
        const txs = await txRes.json();
        const investTxs = txs.filter(tx => tx.type.includes('INVESTMENT'));

        document.getElementById('history-list').innerHTML = investTxs.length > 0 ? investTxs.map(tx => `
          <div class="tx-item">
            <div class="tx-info">
              <h4>${tx.type.replace(/_/g, ' ')}</h4>
              <p>${tx.details && tx.details.includes('|') ? tx.details.split('|')[0] : 'General Portfolio'}</p>
            </div>
            <div class="tx-amount" style="color:${tx.status === 'Approved' ? 'var(--emerald)' : (tx.status === 'Rejected' ? 'var(--danger)' : '#F59E0B')}">
              ${formatUSD(tx.amount)}
              <div style="font-size:0.7rem; color:var(--muted); font-family: var(--font-main);">${tx.status}</div>
            </div>
          </div>
        `).join('') : '<p style="text-align:center; color: var(--muted); font-size: 0.9rem;">No investment history.</p>';
      } catch(err) { 
        console.error(err); 
        document.getElementById('history-list').innerHTML = '<p style="color:red; text-align:center;">Failed to load data.</p>';
      }
    }

    function updateUI() {
      document.getElementById('capital-val').textContent = formatUSD(liveCapital);
      document.getElementById('profit-val').textContent = `+${formatUSD(liveProfit)}`;
      document.getElementById('total-val').textContent = formatUSD(liveCapital + liveProfit);
    }

    setInterval(() => {
      if (profitTickRate > 0) {
        liveProfit += profitTickRate;
        updateUI();
      }
    }, 1000);

    function closeModal() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('open')); }

    async function submitDeposit() {
      const amount = parseFloat(document.getElementById('dep-amount').value);
      const ref = document.getElementById('dep-ref').value;
      const file = document.getElementById('dep-screenshot').files[0];
      const assetFull = document.getElementById('dep-asset-name').value;
      const term = document.getElementById('dep-term').value;
      const msg = document.getElementById('dep-msg');

      if (!amount || !file) { msg.textContent = "Amount and receipt required."; msg.style.color = "red"; return; }

      const assetName = assetFull.split(' (')[0];
      const assetCategory = assetFull.split('(')[1].replace(')', '');

      const formData = new FormData();
      formData.append('userId', user.id);
      formData.append('amount', amount);
      formData.append('reference', ref);
      formData.append('assetName', assetName);
      formData.append('assetCategory', assetCategory);
      formData.append('term', term);
      formData.append('screenshot', file);

      msg.textContent = "Uploading..."; msg.style.color = "var(--emerald)";

      const res = await fetch('/api/investments/deposit', { method: 'POST', body: formData });
      const data = await res.json();
      
      if(data.success) {
        msg.textContent = "Pending Admin Approval."; 
        msg.style.color = "var(--emerald)";
        setTimeout(() => { 
          closeModal(); 
          loadAdminDetailsAndHistory(); 
        }, 2000);
      } else {
        msg.textContent = data.error; msg.style.color = "red";
      }
    }

    fetchMarketData().then(() => {
      switchTab('crypto', document.querySelector('.tab-btn.active'));
    });
    fetchCustomAssets();
    loadAdminDetailsAndHistory();
  </script>
</body>
</html>
