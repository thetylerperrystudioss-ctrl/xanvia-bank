<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Application | Xanvia Credit Union</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root { --emerald: #0F8A5F; --deep-green: #0B2E23; --bg: #F8F9FA; --text: #1A1A1A; --border: #E5E7EB; --muted: #6B7280; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    
    .form-card { background: white; width: 100%; max-width: 480px; padding: 35px; border-radius: 24px; box-shadow: 0 20px 40px rgba(11,46,35,0.08); border: 1px solid var(--border); position: relative; }
    
    .back-btn { position: absolute; top: 25px; left: 25px; text-decoration: none; color: var(--muted); font-size: 1.2rem; transition: 0.2s; }
    .back-btn:hover { color: var(--deep-green); }

    .header-icon { width: 60px; height: 60px; background: #E6F4EE; color: var(--emerald); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 20px; }
    
    .form-card h1 { font-family: 'Merriweather', serif; font-size: 1.6rem; color: var(--deep-green); margin-bottom: 8px; text-align: center; }
    .form-card p.subtitle { color: var(--muted); font-size: 0.95rem; margin-bottom: 25px; text-align: center; line-height: 1.5; }

    /* PROGRESS BAR */
    .progress-container { margin-bottom: 30px; }
    .progress-labels { display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
    .progress-bg { width: 100%; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--emerald); border-radius: 3px; width: 50%; transition: width 0.4s ease; }

    .form-group { display: flex; flex-direction: column; margin-bottom: 20px; width: 100%; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: var(--text); }
    .form-group input { width: 100%; padding: 16px; border: 1px solid var(--border); border-radius: 12px; font-size: 1rem; outline: none; background: #FAFAFA; transition: 0.2s; }
    .form-group input:focus { border-color: var(--emerald); background: white; box-shadow: 0 0 0 4px rgba(15,138,95,0.1); }

    .security-note { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--muted); margin-bottom: 25px; justify-content: center; background: #F4F7F6; padding: 10px; border-radius: 8px; }
    
    .btn-primary { width: 100%; padding: 16px; background: var(--emerald); color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px rgba(15,138,95,0.2); }
    .btn-primary:hover { background: var(--emerald-dark); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(1px); }

    .msg { display: none; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; text-align: center; font-weight: 600; }
    .msg.error { display: block; background: #FEE2E2; color: #991B1B; }
    .msg.success { display: block; background: #D1FAE5; color: #065F46; }
  </style>
</head>
<body>
  <div class="form-card">
    <a href="hub.html" class="back-btn">←</a>
    
    <div class="header-icon" id="header-icon">🏦</div>
    <h1 id="page-title">Application</h1>
    <p class="subtitle" id="page-desc">Please complete the required information to open your account.</p>
    
    <div class="progress-container">
      <div class="progress-labels">
        <span>Identity Verification</span>
        <span>Step 1 of 1</span>
      </div>
      <div class="progress-bg">
        <div class="progress-fill"></div>
      </div>
    </div>

    <div id="msg" class="msg"></div>

    <form id="onboard-form">
      <div class="form-group">
        <label>Date of Birth</label>
        <input type="number" id="age" placeholder="Age (e.g. 25)" min="18" max="100" required>
      </div>
      
      <div class="form-group">
        <label>Residential Address</label>
        <input type="text" id="address" placeholder="123 Main St, City, State, ZIP" required>
      </div>
      
      <div class="form-group">
        <label>SSN (Last 4 Digits)</label>
        <input type="text" id="ssn" placeholder="XXXX" maxlength="4" required>
      </div>

      <div class="security-note">
        <span>🔒</span> Secured with 256-bit encryption
      </div>

      <button type="submit" class="btn-primary" id="submit-btn">Submit Application</button>
    </form>
  </div>

  <script>
    // Check for temp_user (registration) OR xanvia_user (applying for new accounts)
    let user = JSON.parse(localStorage.getItem("temp_user"));
    let isNewRegistration = false;
    
    if (!user) {
      user = JSON.parse(localStorage.getItem("xanvia_user"));
      if (!user) window.location.replace("../index.html");
    } else {
      isNewRegistration = true;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const accountType = urlParams.get('type') || 'bank';

    // Dynamic UI based on account type
    if (accountType === 'bank') {
      document.getElementById('header-icon').textContent = '🏦';
      document.getElementById('page-title').textContent = "Banking Application";
      document.getElementById('page-desc').textContent = "Provide your KYC details to open your main checking account.";
    }
    if (accountType === 'loan') {
      document.getElementById('header-icon').textContent = '💳';
      document.getElementById('page-title').textContent = "Loan Application";
      document.getElementById('page-desc').textContent = "Verify your details to apply for a loan. Your info must match your main bank account.";
    }
    if (accountType === 'investment') {
      document.getElementById('header-icon').textContent = '📈';
      document.getElementById('page-title').textContent = "Investment Application";
      document.getElementById('page-desc').textContent = "Verify your details to open a brokerage account. Your info must match your main bank account.";
    }

    document.getElementById('onboard-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const msg = document.getElementById('msg');
      
      btn.textContent = "Verifying Details...";
      btn.disabled = true;
      msg.style.display = "none";
      
      const age = document.getElementById('age').value;
      const address = document.getElementById('address').value;
      const ssn = document.getElementById('ssn').value;

      try {
        const res = await fetch('/api/complete-onboarding', {
          method: 'POST', 
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: user.id, type: accountType, age, address, ssn_last4: ssn })
        });
        
        const data = await res.json();
        
        if (data.success) {
          msg.className = "msg success";
          msg.textContent = "Application approved! Redirecting...";
          
          if (isNewRegistration) {
            // If this was a fresh registration, we need to create the real session
            const realUser = { 
              id: user.id, 
              email: user.email, 
              name: user.name, 
              has_bank: false, 
              has_loan: false, 
              has_investment: false,
              needs_fee: true 
            };
            localStorage.setItem("xanvia_user", JSON.stringify(realUser));
            localStorage.removeItem("temp_user");
          } else {
            // If existing user applying for a new account, just update flags
            if (accountType === 'bank') user.has_bank = true;
            if (accountType === 'loan') user.has_loan = true;
            if (accountType === 'investment') user.has_investment = true;
            localStorage.setItem("xanvia_user", JSON.stringify(user));
          }

          setTimeout(() => {
            window.location.href = "hub.html";
          }, 1500);
          
        } else {
          msg.className = "msg error";
          msg.textContent = data.error || "Application failed.";
          btn.textContent = "Submit Application";
          btn.disabled = false;
        }
      } catch (err) {
        msg.className = "msg error";
        msg.textContent = "Server error. Try again.";
        btn.textContent = "Submit Application";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
