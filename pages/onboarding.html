<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Verification | Xanvia Bank</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --emerald: #0F8A5F; --deep-green: #0B2E23; --bg: #F8F9FA; --text: #1A1A1A; --border: #E5E7EB; --muted: #6B7280; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .form-card { background: white; width: 100%; max-width: 480px; padding: 35px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid var(--border); }
    .form-card h1 { font-size: 1.6rem; color: var(--deep-green); margin-bottom: 8px; }
    .form-card p { color: var(--muted); font-size: 0.95rem; margin-bottom: 25px; }
    .form-group { display: flex; flex-direction: column; margin-bottom: 20px; width: 100%; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: var(--text); }
    .form-group input { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; outline: none; background: #FAFAFA; }
    .btn-primary { width: 100%; padding: 16px; background: var(--emerald); color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 10px; }
    .msg { display: none; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; text-align: center; }
    .msg.error { display: block; background: #FEE2E2; color: #991B1B; }
    .msg.success { display: block; background: #D1FAE5; color: #065F46; }
  </style>
</head>
<body>
  <div class="form-card">
    <h1>Identity Verification</h1>
    <p>Please provide your KYC details. Your DOB, Address, and SSN must match your main account exactly for future applications.</p>
    <div id="msg" class="msg"></div>

    <form id="onboard-form">
      <div class="form-group"><label>Date of Birth / Age</label><input type="number" id="age" placeholder="e.g. 25" min="18" max="100" required></div>
      <div class="form-group"><label>Residential Address</label><input type="text" id="address" placeholder="123 Main St, City, State, ZIP" required></div>
      <div class="form-group"><label>SSN (Last 4 Digits)</label><input type="text" id="ssn" placeholder="XXXX" maxlength="4" required></div>
      <button type="submit" class="btn-primary" id="submit-btn">Verify Identity</button>
    </form>
  </div>

  <script>
    let user = JSON.parse(localStorage.getItem("temp_user"));
    if (!user) window.location.replace("../index.html");

    document.getElementById('onboard-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const msg = document.getElementById('msg');
      
      btn.textContent = "Verifying..."; msg.style.display = "none";
      
      const age = document.getElementById('age').value;
      const address = document.getElementById('address').value;
      const ssn = document.getElementById('ssn').value;

      try {
        const res = await fetch('/api/complete-onboarding', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: user.id, type: 'kyc', age, address, ssn_last4: ssn })
        });
        
        const data = await res.json();
        if (data.success) {
          msg.className = "msg success"; msg.textContent = "Identity Verified! Taking you to the Hub...";
          
          // Update the main user session so they are logged in
          const realUser = { id: user.id, email: user.email, has_bank: false, has_loan: false, has_investment: false };
          localStorage.setItem("xanvia_user", JSON.stringify(realUser));
          localStorage.removeItem("temp_user");

          setTimeout(() => { window.location.href = "hub.html"; }, 1500);
        } else {
          msg.className = "msg error"; msg.textContent = data.error || "Verification failed.";
          btn.textContent = "Verify Identity";
        }
      } catch (err) {
        msg.className = "msg error"; msg.textContent = "Server error."; btn.textContent = "Verify Identity";
      }
    });
  </script>
</body>
</html>
