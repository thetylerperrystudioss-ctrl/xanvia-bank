<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Transfer | Xanvia Credit Union</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --emerald: #0F8A5F; --deep-green: #0B2E23; --bg: #F4F7F6; --text: #1A1A1A; --border: #E5E7EB; --muted: #6B7280; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); display: flex; justify-content: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 600px; padding: 20px; }
    
    .header { display: flex; align-items: center; margin-bottom: 25px; }
    .back-btn { text-decoration: none; font-size: 1.5rem; color: var(--deep-green); margin-right: 15px; }
    .header h1 { font-size: 1.4rem; color: var(--deep-green); font-weight: 700; }

    /* TAB SWITCHER */
    .tabs { display: flex; background: #E5E7EB; border-radius: 10px; padding: 4px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; text-align: center; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; border: none; background: transparent; color: var(--muted); transition: 0.2s; }
    .tab-btn.active { background: white; color: var(--deep-green); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

    .card { background: white; border-radius: 16px; padding: 25px; border: 1px solid var(--border); }
    
    .form-group { margin-bottom: 20px; display: flex; flex-direction: column; }
    .form-group label { font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; color: var(--text); }
    .form-group input, .form-group select { padding: 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; outline: none; transition: 0.2s; }
    .form-group input:focus { border-color: var(--emerald); box-shadow: 0 0 0 3px rgba(15,138,95,0.1); }
    
    .recipient-info { display: none; background: #D1FAE5; color: #065F46; padding: 12px; border-radius: 8px; margin-top: 10px; font-weight: 600; font-size: 0.9rem; text-align: center; }

    /* NEW: QUICK AMOUNTS */
    .quick-amounts { display: flex; gap: 10px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
    .quick-amounts::-webkit-scrollbar { display: none; }
    .quick-btn { background: #F4F7F6; border: 1px solid var(--border); padding: 8px 16px; border-radius: 20px; font-size: 0.9rem; font-weight: 600; color: var(--deep-green); cursor: pointer; transition: 0.2s; white-space: nowrap; }
    .quick-btn:hover { background: #E6F4EE; border-color: var(--emerald); }
    .quick-btn:active { transform: scale(0.95); }

    /* NEW: RECENT RECIPIENTS */
    .recent-recipients { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 10px; scrollbar-width: none; }
    .recent-recipients::-webkit-scrollbar { display: none; }
    .recipient-avatar { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; min-width: 65px; }
    .recipient-avatar .circle { width: 50px; height: 50px; border-radius: 50%; background: var(--emerald); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.2rem; border: 2px solid transparent; transition: 0.2s; }
    .recipient-avatar:hover .circle { border-color: var(--gold); transform: translateY(-2px); }
    .recipient-avatar span { font-size: 0.75rem; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 65px; }

    .btn-primary { width: 100%; padding: 16px; background: var(--emerald); color: white; border: none; border-radius: 10px;; font-weight: 600; font-size: 1rem; cursor font: pointer; transition: 0.2-weights; margin-top: 10px;: }
    .btn-primary:disabled { opacity:  0.5; cursor: not-allowed; }
    
600    #msg { display: none; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; text-align: center; }
    #msg.error { background: #FEE2E2; color: #991B1B; }
    #msg.success { background: #D1FAE5; color: #065F46; }

    #external-form { display: none; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <a href="dashboard.html" class="back-btn">←</a>
      <h1>Transfer Funds</h1>
    </div>

    <div id="msg"></div>

    <div class="tabs">
      <button class="tab-btn active" id="tab-internal" onclick="switchTab('internal')">Xanvia Bank</button>
      <button class="tab-btn" id="tab-external" onclick="switchTab('external')">Other Banks</button>
    </div>

    <div class="card">
      <!-- INTERNAL TRANSFER FORM -->
      <div id="internal-form">
        
        <!-- NEW RECENT RECIPIENTS UI -->
        <div id="recent-container" style="display: none;">
          <label style="font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; display: block; color: var(--text);">Recent Recipients</label>
          <div class="recent-recipients" id="recent-list">
            <!-- Injected via JS -->
          </div>
        </div>

        <div class="form-group">
          <label>Recipient Xanvia Account Number</label>
          <input type="number" id="recipient-account" placeholder="Enter account number" oninput="lookupAccount()">
          <div id="recipient-name" class="recipient-info"></div>
        </div>

        <div class="form-group">
          <label>Amount ($)</label>
          <!-- NEW QUICK AMOUNTS UI -->
          <div class="quick-amounts">
            <button class="quick-btn" onclick="setAmount('internal-amount', 50)">$50</button>
            <button class="quick-btn" onclick="setAmount('internal-amount', 100)">$100</button>
            <button class="quick-btn" onclick="setAmount('internal-amount', 500)">$500</button>
            <button class="quick-btn" onclick="setAmount('internal-amount', 1000)">$1,000</button>
          </div>
          <input type="number" id="internal-amount" placeholder="0.00">
        </div>

        <button class="btn-primary" id="internal-btn" onclick="submitInternalTransfer()" disabled>Send to Xanvia</button>
      </div>

      <!-- EXTERNAL TRANSFER FORM -->
      <div id="external-form">
        <div class="form-group">
          <label>Bank Name</label>
          <input type="text" id="ext-bank" placeholder="e.g. Chase Bank">
        </div>
        <div class="form-group">
          <label>Account Name</label>
          <input type="text" id="ext-name" placeholder="John Doe">
        </div>
        <div class="form-group">
          <label>Account Number</label>
          <input type="text" id="ext-account" placeholder="Enter account number">
        </div>
        <div class="form-group">
          <label>Routing Number</label>
          <input type="text" id="ext-routing" placeholder="Enter routing number">
        </div>
        <div class="form-group">
          <label>Amount ($)</label>
          <!-- NEW QUICK AMOUNTS UI FOR EXTERNAL -->
          <div class="quick-amounts">
            <button class="quick-btn" onclick="setAmount('external-amount', 50)">$50</button>
            <button class="quick-btn" onclick="setAmount('external-amount', 100)">$100</button>
            <button class="quick-btn" onclick="setAmount('external-amount', 500)">$500</button>
            <button class="quick-btn" onclick="setAmount('external-amount', 1000)">$1,000</button>
          </div>
          <input type="number" id="external-amount" placeholder="0.00">
        </div>

        <button class="btn-primary" onclick="submitExternalTransfer()">Send to Other Bank</button>
      </div>
    </div>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem("xanvia_user"));
    if (!user) window.location.replace("../index.html");

    let validRecipient = false;
    let currentTab = 'internal';

    // --- NEW: QUICK AMOUNT LOGIC ---
    function setAmount(inputId, amount) {
      document.getElementById(inputId).value = amount;
    }

    // --- NEW: RECENT RECIPIENTS LOGIC ---
    function loadRecentRecipients() {
      const recents = JSON.parse(localStorage.getItem("xanvia_recents")) || [];
      if (recents.length === 0) return;

      document.getElementById('recent-container').style.display = 'block';
      document.getElementById('recent-list').innerHTML = recents.map(r => `
        <div class="recipient-avatar" onclick="selectRecipient('${r.account}', '${r.name}')">
          <div class="circle">${r.name.charAt(0).toUpperCase()}</div>
          <span>${r.name.split(' ')[0]}</span>
        </div>
      `).join('');
    }

    function selectRecipient(account, name) {
      document.getElementById('recipient-account').value = account;
      document.getElementById('recipient-name').textContent = `Recipient: ${name}`;
      document.getElementById('recipient-name').style.display = 'block';
      document.getElementById('internal-btn').disabled = false;
      validRecipient = true;
    }

    function saveRecentRecipient(account, name) {
      let recents = JSON.parse(localStorage.getItem("xanvia_recents")) || [];
      // Remove if it already exists to move it to the front
      recents = recents.filter(r => r.account !== account);
      recents.unshift({ account, name });
      // Keep only the top 5
      recents = recents.slice(0, 5);
      localStorage.setItem("xanvia_recents", JSON.stringify(recents));
    }

    // --- EXISTING TABS LOGIC ---
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');

      if (tab === 'internal') {
        document.getElementById('internal-form').style.display = 'block';
        document.getElementById('external-form').style.display = 'none';
      } else {
        document.getElementById('internal-form').style.display = 'none';
        document.getElementById('external-form').style.display = 'block';
      }
    }

    // --- EXISTING LOOKUP LOGIC ---
    async function lookupAccount() {
      const accNum = document.getElementById('recipient-account').value;
      const nameDisplay = document.getElementById('recipient-name');
      const sendBtn = document.getElementById('internal-btn');

      if (accNum.length < 8) {
        nameDisplay.style.display = 'none';
        sendBtn.disabled = true;
        validRecipient = false;
        return;
      }

      try {
        const res = await fetch(`/api/lookup-account/${accNum}`);
        const data = await res.json();

        if (data.success) {
          nameDisplay.textContent = `Recipient: ${data.name}`;
          nameDisplay.style.display = 'block';
          sendBtn.disabled = false;
          validRecipient = true;
        } else {
          nameDisplay.style.display = 'none';
          sendBtn.disabled = true;
          validRecipient = false;
        }
      } catch (err) {
        console.error(err);
      }
    }

    // --- EXISTING SUBMIT INTERNAL ---
    async function submitInternalTransfer() {
      const recipientAccount = document.getElementById('recipient-account').value;
      const amount = document.getElementById('internal-amount').value;
      const msg = document.getElementById('msg');
      const btn = document.getElementById('internal-btn');

      if (!validRecipient) { msg.className = "error"; msg.textContent = "Invalid account."; msg.style.display = "block"; return; }
      if (!amount || isNaN(amount) || amount <= 0) { msg.className = "error"; msg.textContent = "Enter a valid amount."; msg.style.display = "block"; return; }

      // Grab the name before we send the request
      const recipientName = document.getElementById('recipient-name').textContent.replace('Recipient: ', '');

      btn.textContent = "Sending...";
      btn.disabled = true;
      msg.style.display = "none";

      try {
        const res = await fetch('/api/transfer/internal', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: user.id, recipientAccount, amount })
        });

        const data = await res.json();

        if (data.success) {
          // NEW: Save to recent recipients on success
          saveRecentRecipient(recipientAccount, recipientName);

          msg.className = "success";
          msg.textContent = data.message;
          msg.style.display = "block";
          btn.textContent = "Success!";
          setTimeout(() => { window.location.href = "dashboard.html"; }, 2000);
        } else {
          msg.className = "error";
          msg.textContent = data.error || "Failed to send.";
          msg.style.display = "block";
          btn.textContent = "Send to Xanvia";
          btn.disabled = false;
        }
      } catch (err) {
        msg.className = "error"; msg.textContent = "Network error."; msg.style.display = "block";
        btn.textContent = "Send to Xanvia"; btn.disabled = false;
      }
    }

    // --- EXISTING SUBMIT EXTERNAL ---
    async function submitExternalTransfer() {
      const bankName = document.getElementById('ext-bank').value;
      const accountName = document.getElementById('ext-name').value;
      const accountNumber = document.getElementById('ext-account').value;
      const routingNumber = document.getElementById('ext-routing').value;
      const amount = document.getElementById('external-amount').value;
      const msg = document.getElementById('msg');

      if (!bankName || !accountName || !accountNumber || !routingNumber || !amount) {
        msg.className = "error"; msg.textContent = "Please fill all external bank details."; msg.style.display = "block"; return;
      }

      const details = `External Transfer to ${bankName} (Acct: ${accountNumber}, Name: ${accountName}, Routing: ${routingNumber})`;
      msg.style.display = "none";

      try {
        const res = await fetch('/api/withdraw/request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: user.id, amount, details })
        });

        const data = await res.json();

        if (data.success) {
          msg.className = "success";
          msg.textContent = "External transfer submitted. Pending Admin approval.";
          msg.style.display = "block";
          setTimeout(() => { window.location.href = "dashboard.html"; }, 2000);
        } else {
          msg.className = "error";
          msg.textContent = data.error || "Failed to send.";
          msg.style.display = "block";
        }
      } catch (err) {
        msg.className = "error"; msg.textContent = "Network error."; msg.style.display = "block";
      }
    }

    // Initialize recent recipients on load
    loadRecentRecipients();
  </script>
</body>
</html>
