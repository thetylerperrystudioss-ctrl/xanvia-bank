<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reset Password | Xanvia Credit Union</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root { --emerald: #0F8A5F; --emerald-dark: #0A5F42; --deep-green: #0B2E23; --bg: #F4F7F6; --text: #1A1A1A; --border: #E5E7EB; --muted: #6B7280; --gold: #C9A24B; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--deep-green); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; background-image: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070&auto=format&fit=crop'); background-size: cover; background-position: center; }
    
    /* DARK OVERLAY ON BACKGROUND */
    body::before { content: ''; position: absolute; inset: 0; background: rgba(11, 46, 35, 0.85); z-index: 1; backdrop-filter: blur(8px); }

    .card { background: white; width: 100%; max-width: 420px; padding: 40px 30px; border-radius: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.3); position: relative; z-index: 10; }
    
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 25px; justify-content: center; }
    .logo-icon { background: var(--emerald); color: white; width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 900; }
    .logo-text { display: flex; flex-direction: column; }
    .logo-title { font-family: 'Merriweather', serif; font-size: 1.5rem; font-weight: 900; color: var(--deep-green); line-height: 1; }
    .logo-subtitle { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: var(--gold); letter-spacing: 1.5px; margin-top: 2px; }

    .card h2 { text-align: center; color: var(--deep-green); margin-bottom: 8px; font-size: 1.5rem; }
    .card p.sub { text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 25px; line-height: 1.5; }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: var(--text); }
    .form-group input { width: 100%; padding: 15px; border: 1px solid var(--border); border-radius: 12px; font-size: 1rem; outline: none; background: #FAFAFA; transition: 0.2s; }
    .form-group input:focus { border-color: var(--emerald); background: white; box-shadow: 0 0 0 4px rgba(15,138,95,0.1); }

    .btn-primary { width: 100%; padding: 16px; background: var(--emerald); color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px rgba(15,138,95,0.2); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }

    .msg { display: none; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; text-align: center; font-weight: 600; }
    .msg.error { display: block; background: #FEE2E2; color: #991B1B; }
    .msg.success { display: block; background: #D1FAE5; color: #065F46; }

    .back-link { text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--muted); font-weight: 600; }
    .back-link a { color: var(--emerald); text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">X</div>
      <div class="logo-text">
        <span class="logo-title">Xanvia</span>
        <span class="logo-subtitle">Credit Union</span>
      </div>
    </div>

    <h2>Reset Password</h2>
    <p class="sub">Enter your registered email address and we'll send you a temporary password.</p>
    
    <div id="msg" class="msg"></div>
    
    <form id="forgot-form">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="john@gmail.com" required>
      </div>
      <button type="submit" class="btn-primary" id="submit-btn">Send Reset Link</button>
    </form>
    
    <div class="back-link"><a href="login.html">← Back to Login</a></div>
  </div>

  <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const msg = document.getElementById('msg');
      const email = document.getElementById('email').value;

      btn.textContent = "Processing..."; 
      btn.disabled = true;
      msg.style.display = "none";

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (data.success) {
          msg.className = "msg success";
          msg.innerHTML = `${data.message}<br><br><a href="login.html" style="color:var(--emerald); font-weight:bold;">Proceed to Login</a>`;
        } else {
          msg.className = "msg error"; 
          msg.textContent = data.error || "Failed to reset.";
          btn.textContent = "Send Reset Link";
          btn.disabled = false;
        }
      } catch (err) {
        msg.className = "msg error"; 
        msg.textContent = "Server error. Try again.";
        btn.textContent = "Send Reset Link";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
