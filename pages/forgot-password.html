<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Xanvia Credit Union</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --emerald: #0F8A5F; --deep-green: #0B2E23; --bg: #F8F9FA; --text: #1A1A1A; --border: #E5E7EB; --muted: #6B7280; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--deep-green); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: white; width: 100%; max-width: 400px; padding: 40px 30px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
    .card h2 { text-align: center; color: var(--deep-green); margin-bottom: 10px; }
    .card p { text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 25px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; outline: none; }
    .btn-primary { width: 100%; padding: 16px; background: var(--emerald); color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 1rem; cursor: pointer; }
    .msg { display: none; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; text-align: center; }
    .msg.error { display: block; background: #FEE2E2; color: #991B1B; }
    .msg.success { display: block; background: #D1FAE5; color: #065F46; }
    .back-link { text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--muted); }
    .back-link a { color: var(--emerald); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Reset Password</h2>
    <p>Enter your registered email address to reset your password.</p>
    <div id="msg" class="msg"></div>
    <form id="forgot-form">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="john@gmail.com" required>
      </div>
      <button type="submit" class="btn-primary" id="submit-btn">Send Reset Request</button>
    </form>
    <div class="back-link"><a href="login.html">← Back to Login</a></div>
  </div>

  <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const msg = document.getElementById('msg');
      const email = document.getElementById('email').value;

      btn.textContent = "Processing..."; msg.style.display = "none";

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (data.success) {
          msg.className = "msg success"; 
          msg.innerHTML = `${data.message}<br><br><a href="login.html" style="color:var(--emerald); font-weight:bold;">Go to Login</a>`;
        } else {
          msg.className = "msg error"; msg.textContent = data.error || "Failed.";
          btn.textContent = "Send Reset Request";
        }
      } catch (err) {
        msg.className = "msg error"; msg.textContent = "Server error. Try again.";
        btn.textContent = "Send Reset Request";
      }
    });
  </script>
</body>
