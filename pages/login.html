<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Xanvia Bank</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --emerald: #0F8A5F; --deep-green: #0B2E23; --bg: #F8F9FA; --text: #1A1A1A; --border: #E5E7EB; --muted: #6B7280;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    
    .auth-card {
      background: white; width: 100%; max-width: 420px; padding: 40px 30px;
      border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid var(--border);
    }
    
    .logo { font-family: 'Merriweather', serif; font-size: 1.8rem; font-weight: 900; color: var(--emerald); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .logo-icon { background: var(--emerald); color: white; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; font-size: 1rem; }
    
    h2 { color: var(--deep-green); font-size: 1.8rem; margin-bottom: 8px; }
    p.sub { color: var(--muted); font-size: 0.95rem; margin-bottom: 30px; }
    
    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 8px; }
    .input-group input { width: 100%; padding: 15px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; outline: none; transition: 0.2s; background: #FAFAFA; }
    .input-group input:focus { border-color: var(--emerald); background: white; box-shadow: 0 0 0 3px rgba(15,138,95,0.1); }
    
    .btn-primary { width: 100%; padding: 16px; background: var(--emerald); color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    .btn-primary:active { background: #0A5F42; transform: scale(0.98); }
    
    .switch-link { text-align: center; margin-top: 25px; font-size: 0.9rem; color: var(--muted); }
    .switch-link a { color: var(--emerald); font-weight: 600; text-decoration: none; }
    .switch-link a:hover { text-decoration: underline; }
    
    .msg { display: none; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; text-align: center; font-weight: 500; }
    .msg.error { display: block; background: #FEE2E2; color: #991B1B; }
    .msg.success { display: block; background: #D1FAE5; color: #065F46; }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="logo"><div class="logo-icon">X</div> Xanvia</div>
    <h2>Welcome Back</h2>
    <p class="sub">Enter your credentials to access your account.</p>
    
    <div id="msg" class="msg"></div>

    <form id="login-form">
      <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="name@example.com" required>
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary">Log In</button>
    </form>

    <div class="switch-link">
      Need an account? <a href="register.html">Sign Up</a>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('msg');
      const btn = document.querySelector('.btn-primary');

      btn.textContent = "Authenticating...";
      msg.className = "msg";

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success) {
          msg.className = "msg success";
          msg.textContent = "Success! Redirecting...";
          
          // Save User session
          localStorage.setItem("xanvia_user", JSON.stringify(data.user));
          
          // Route based on account status
          setTimeout(() => {
            window.location.href = "hub.html"; 
          }, 1000);
        } else {
          msg.className = "msg error";
          msg.textContent = data.error || "Login failed.";
          btn.textContent = "Log In";
        }
      } catch (err) {
        msg.className = "msg error";
        msg.textContent = "Server connection error.";
        btn.textContent = "Log In";
      }
    });
  </script>
</body>
</html>
