<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login | Xanvia Credit Union</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root { --emerald: #0F8A5F; --emerald-dark: #0A5F42; --deep-green: #0B2E23; --text: #1A1A1A; --border: #E5E7EB; --muted: #6B7280; --gold: #C9A24B; --danger: #EF4444; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { background-color: var(--deep-green); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; position: relative; overflow-y: auto; overflow-x: hidden; }
    .bg-layer { position: fixed; inset: 0; background-image: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070&auto=format&fit=crop'); background-size: cover; background-position: center; z-index: 1; }
    .bg-overlay { position: fixed; inset: 0; background: rgba(11, 46, 35, 0.85); z-index: 2; backdrop-filter: blur(10px); }

    .login-card { background: #FFFFFF; width: 100%; max-width: 420px; padding: 40px 30px 30px; border-radius: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.3); position: relative; z-index: 10; display: block; flex-shrink: 0; }
    
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; justify-content: center; }
    .logo-icon { background: var(--emerald); color: white; width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 900; }
    .logo-text { display: flex; flex-direction: column; }
    .logo-title { font-family: 'Merriweather', serif; font-size: 1.5rem; font-weight: 900; color: var(--deep-green); line-height: 1; }
    .logo-subtitle { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: var(--gold); letter-spacing: 1.5px; margin-top: 2px; }

    .login-card h2 { text-align: center; color: var(--deep-green); margin-bottom: 8px; font-size: 1.5rem; }
    .login-card p.sub { text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 30px; }

    .form-group { margin-bottom: 20px; position: relative; display: block; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: var(--text); }
    .form-group input { width: 100%; padding: 15px; border: 1px solid var(--border); border-radius: 12px; font-size: 1rem; outline: none; background: #FAFAFA; transition: 0.2s; display: block; }
    .form-group input:focus { border-color: var(--emerald); background: white; box-shadow: 0 0 0 4px rgba(15,138,95,0.1); }
    
    .password-toggle { position: absolute; right: 15px; top: 40px; cursor: pointer; color: var(--muted); font-size: 1.1rem; z-index: 20; }
    .forgot-link { display: block; text-align: right; font-size: 0.85rem; color: var(--emerald); font-weight: 600; text-decoration: none; margin-top: -5px; margin-bottom: 25px; }

    /* BUTTON WITH LONG PRESS HOLD INDICATOR */
    .btn-primary { 
      width: 100%; 
      padding: 16px; 
      background: var(--emerald); 
      color: white; 
      border: none; 
      border-radius: 12px; 
      font-weight: 700; 
      font-size: 1rem; 
      cursor: pointer; 
      transition: 0.2s; 
      box-shadow: 0 4px 12px rgba(15,138,95,0.2); 
      position: relative; 
      overflow: hidden; 
      user-select: none; 
      -webkit-user-select: none; 
      touch-action: manipulation; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      z-index: 10; 
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }
    
    .hold-indicator { position: absolute; bottom: 0; left: 0; height: 4px; background: var(--gold); width: 0%; transition: width 0.1s linear; z-index: 10; }
    
    .msg { display: none; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; text-align: center; font-weight: 600; }
    .msg.error { display: block; background: #FEE2E2; color: #991B1B; }

    .footer-link { text-align: center; margin-top: 25px; font-size: 0.9rem; color: var(--muted); }
    .footer-link a { color: var(--emerald); font-weight: 700; text-decoration: none; }

    #admin-login-section { display: none; }
    .back-btn { position: absolute; top: 20px; left: 20px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--muted); display: none; z-index: 20; }
  </style>
</head>
<body>

  <div class="bg-layer"></div>
  <div class="bg-overlay"></div>

  <div class="login-card">
    <button class="back-btn" id="back-btn" onclick="resetView()">←</button>

    <!-- USER LOGIN VIEW -->
    <div id="user-login-section">
      <div class="logo">
        <div class="logo-icon">X</div>
        <div class="logo-text">
          <span class="logo-title">Xanvia</span>
          <span class="logo-subtitle">Credit Union</span>
        </div>
      </div>
      <h2>Welcome Back</h2>
      <p class="sub">Sign in to access your accounts securely.</p>
      
      <div id="user-msg" class="msg"></div>
Hold      
      <div class="form-group">
        <label>(eEmail or Username</label>
        <input type="text" id="user-identifier" placeholder="Enter email or username">
      </div>
      
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="user-password" placeholder="Enter password">
        <span class="password-toggle" onclick="togglePassword('user-password', this)">👁️</span>
      </div>
      
      <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>

      <!-- BUTTON WITH LONG PRESS -->
      <button class="btn-primary" id="login-btn">
        <span id="btn-text">Secure Sign In</span>
        <div class="hold-indicator" id="hold-bar"></div>
      </button>
      
      <div class="footer-link">
        Don't have an account? <a href="register.html">Apply Now</a>
      </div>
    </div>

    <!-- ADMIN LOGIN VIEW -->
    <div id="admin-login-section">
      <div class="logo" style="margin-bottom: 20px;">
        <div class="logo-icon" style="background:var(--deep-green);">🛡️</div>
      </div>
      <h2>Admin Access</h2>
      <p class="sub">Authorized personnel only.</p>
      
      <div id="admin-msg" class="msg"></div>
      
      <div class="form-group">
        <label>Admin Passcode</label>
        <input type="password" id="admin-pass" maxlength="4" placeholder="••••" style="text-align: center; letter-spacing: 8px; font-size: 1.5rem;">
      </div>
      
      <button class="btn-primary" onclick="verifyAdmin()" style="background: var(--deep-green);">Unlock Terminal</button>
    </div>

  </div>

  <script>
    const loginBtn = document.getElementById('login-btn');
    const btnText = document.getElementById('btn-text');
)    const holdBar = document.getElementById('hold-bar');
    
    {
 let holdTimer;
    let progressTimer;
         let progress = 0;
    let isHoldTriggered if = false;
    let isLoggingIn = false;

    // LONG PRESS LOGIC
    function startHold(e) {
      if (e) e.preventDefault();
      if (isLoggingIn) return;
      
      progress = 0;
      isHoldTriggered = false;
      holdBar.style.width = '0%';
      
      // Animate the bar over 5 seconds (100 ticks of 50ms = 5000ms)
      progressTimer = setInterval(() => {
        progress += 1;
        holdBar.style.width = (progress / 100) * 100 + '%';
      }, 50);

      // Trigger admin view after 5 seconds
      holdTimer = setTimeout(() => {
        clearInterval(progressTimer);
        holdBar.style.width = '0%';
        isHoldTriggered = true;
        showAdminLogin();
      }, 5000);
    }

    function cancel (e) e.preventDefault();
      clearTimeout(holdTimer);
      clearInterval(progressTimer);
      
      // If released before 5 seconds, reset and login normally
      if (!isHoldTriggered && !isLoggingIn) {
        holdBar.style.width = '0%';
        userLogin();
      }
    }

    loginBtn.addEventListener('pointerdown', startHold);
    loginBtn.addEventListener('pointerup', cancelHold);
    loginBtn.addEventListener('pointercancel', cancelHold);
    loginBtn.addEventListener('pointerleave', cancelHold);

    function showAdminLogin() {
      document.getElementById('user-login-section').style.display = 'none';
      document.getElementById('admin-login-section').style.display = 'block';
      document.getElementById('back-btn').style.display = 'block';
    }

    function resetView() {
      document.getElementById('user-login-section').style.display = 'block';
      document.getElementById('admin-login-section').style.display = 'none';
      document.getElementById('back-btn').style.display = 'none';
      document.getElementById('admin-pass').value = '';
      document.getElementById('admin-msg').style.display = 'none';
    }

    function togglePassword(inputId, icon) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = '🙈';
      } else {
        input.type = 'password';
        icon.textContent = '👁️';
      }
    }

    async function userLogin() {
      const identifier = document.getElementById('user-identifier').value;
      const password = document.getElementById('user-password').value;
      const msg = document.getElementById('user-msg');

      if (!identifier || !password) { 
        msg.textContent = "Please fill in all fields."; 
        msg.className = "msg error"; 
        return; 
      }

      msg.style.display = 'none';
      isLoggingIn = true;
      btnText.textContent = "Authenticating...";
      loginBtn.disabled = true;

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000);

        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password }),
          signal: controller.signal
        });
        
        clearTimeout(timeoutId);

        const contentType = res.headers.get("content-type");
        if (!contentType || !contentType.includes("application/json")) {
          throw new Error("Server Error. The backend might have crashed.");
        }

        const data = await res.json();

        if (data.success) {
          localStorage.setItem("xanvia_user", JSON.stringify(data.user));
          window.location.replace("hub.html");
        } else {
          msg.textContent = data.error;
          msg.className = "msg error";
          btnText.textContent = "Secure Sign In"; 
          loginBtn.disabled = false;
          isLoggingIn = false;
        }
      } catch (err) {
        msg.textContent = err.message === 'The user aborted a request.' ? "Connection timed out. Server is down." : err.message;
        msg.className = "msg error";
        btnText.textContent = "Secure Sign In"; 
        loginBtn.disabled = false;
        isLoggingIn = false;
      }
    }

    function verifyAdmin() {
      const pass = document.getElementById('admin-pass').value;
      const msg = document.getElementById('admin-msg');
      if (pass === "@@@@") {
        window.location.replace("admin.html");
      } else {
        msg.textContent = "Access Denied.";
        msg.className = "msg error";
      }
    }
  </script>
</body>
</html>
